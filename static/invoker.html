<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicons/favicon-16x16.png">
<link rel="manifest" href="/static/favicons/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DH Тренажер Инвокера</title>
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/header.css">
    <link rel="stylesheet" href="/static/css/invoker.css">
</head>
<body id="body-invoker">
    <header>
        <div class="header-left">
            <div class="logo" onclick="window.location.href='/'">DOTA HELPER</div>
            <nav class="main-nav">
                <button class="nav-link" onclick="window.location.href='/drafts'">АНАЛИЗ ДРАФТОВ</button>
                <button class="nav-link" onclick="window.location.href='/fantasy'">ФЕНТАЗИ ПОМОЩНИК</button>
                <button class="nav-link active" onclick="window.location.href='/invoker'">ТРЕНАЖЁР ИНВОКЕР</button>
            </nav>
        </div>
        <div class="user-panel">
            <span id="user-display-name" class="user-badge" onclick="window.location.href='/profile'">Загрузка...</span>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>
    </header>

    <main>
        <div class="game-container">
            <!-- ЭКРАН СТАРТА -->
            <div id="start-screen" class="game-screen">
                <h1 style="margin-bottom: 20px;">ГОТОВ К ТРЕНИРОВКЕ?</h1>
                <p style="color: var(--text-muted); margin-bottom: 40px;">У тебя будет 30 секунд, чтобы нажать как можно больше заклинаний.</p>
                <button class="btn-start" onclick="startGame()">ИГРАТЬ</button>
            </div>

            <!-- ЭКРАН ИГРЫ -->
            <div id="game-screen" class="game-screen hidden">
                <div id="timer" class="timer-display">30</div>
                
                <div class="target-spell-area">
                    <img id="target-spell-img" src="" alt="Spell">
                    <div id="target-spell-name">...</div>
                </div>

                <div class="orbs-container">
                    <div id="orb-0" class="orb"></div>
                    <div id="orb-1" class="orb"></div>
                    <div id="orb-2" class="orb"></div>
                </div>

                <div class="score-text">СЧЕТ: <span id="score-display">0</span></div>
            </div>

            <!-- ЭКРАН РЕЗУЛЬТАТОВ -->
            <div id="result-screen" class="game-screen hidden">
                <h1>ВРЕМЯ ВЫШЛО!</h1>
                <div class="score-text">ТВОЙ РЕЗУЛЬТАТ:</div>
                <div id="final-score" class="final-score">0</div>
                <button class="btn-start" onclick="startGame()">ПОПРОБОВАТЬ СНОВА</button>
            </div>
        </div>

        <div style="margin-top: 30px; color: var(--text-muted); font-size: 0.8rem;">
            Используй клавиши <b>Q W E</b> для сфер и <b>R</b> для каста (Invoke)
        </div>
    </main>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/invoker.js"></script>
    <script>
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await fetch('/api/me');
            const user = await res.json();
            
            if (user.logged_in) {
                // Скрипт ищет твой ID с 26-й строки
                const headerUsername = document.getElementById('user-display-name');
                if (headerUsername) {
                    let nameHtml = user.username;
                    if (user.is_premium) {
                        nameHtml += ' <i class="fas fa-crown" style="color: #FFD700; margin-left: 5px;" title="Premium"></i>';
                    }
                    headerUsername.innerHTML = nameHtml;
                }
            } else {
                window.location.href = '/auth';
            }
        } catch (e) {
            console.error("Ошибка загрузки профиля:", e);
        }
    });

    async function logout() {
        try { await fetch('/api/logout', { method: 'POST' }); } catch (e) {}
        window.location.href = '/auth';
    }
</script>
</body>
</html>
