<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><link rel="stylesheet" href="/static/css/styles.css"></head>
<body>
    <header>
        <div class="header-left"><div class="logo" onclick="window.location.href='/'">Dota 2 Helper</div></div>
        <div class="user-panel"><span id="user-display-name" class="user-badge">...</span><button class="btn-logout" onclick="logout()">Выйти</button></div>
    </header>
    <main style="text-align:center;">
        <div style="background: var(--bg-card); padding: 40px; border-radius: 20px; border: 1px solid var(--border-color); max-width: 500px; margin: 50px auto;">
            <h2 id="profile-user-name">Загрузка...</h2>
            <button class="btn-primary" onclick="openFavModal()" style="margin-top: 20px; width: 100%;">★ ВЫБРАТЬ ЛЮБИМЫХ ГЕРОЕВ</button>
        </div>
    </main>
    <div id="fav-modal" class="modal-overlay hidden">
        <div class="modal-card modal-large">
            <h3>Ваши любимые герои</h3>
            <input type="text" id="fav-search-input" placeholder="Поиск..." oninput="filterFavHeroes()">
            <div id="fav-heroes-container" class="fav-heroes-grid"></div>
            <button class="btn-primary" onclick="saveFavorites()" style="margin-top:15px;">СОХРАНИТЬ</button>
            <button onclick="closeFavModal()">Закрыть</button>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/favorites.js"></script>
</body>
</html>
