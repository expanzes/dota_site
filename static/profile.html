<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Профиль — Dota 2 Helper</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body id="body-profile">
    <header>
        <div class="header-left">
            <div class="logo" onclick="window.location.href='/'">Dota 2 Helper</div>
            <nav class="main-nav">
                <button class="nav-link" onclick="window.location.href='/drafts'">АНАЛИЗ ДРАФТОВ</button>
                <button class="nav-link" onclick="window.location.href='/fantasy'">ФЕНТАЗИ ПОМОЩНИК</button>
                <button class="nav-link" onclick="window.location.href='/invoker'">ТРЕНАЖЁР ИНВОКЕР</button>
            </nav>
        </div>
        <div class="user-panel">
            <span id="user-display-name" class="user-badge">...</span>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>
    </header>

    <main>
        <div class="profile-container">
            <div id="premium-badge" class="hidden" style="color: var(--accent-yellow); font-weight: bold; margin-bottom: 5px;">★ PREMIUM АККАУНТ ★</div>
            
            <img id="profile-avatar" src="" alt="Avatar">

            <div class="profile-name-wrapper">
                <!-- Текст ника -->
                <div id="name-display-area">
                    <h2 id="display-username">Загрузка... <i class="fas fa-pencil-alt edit-icon" onclick="toggleEditName()"></i></h2>
                </div>
                <!-- Поле ввода ника (скрыто) -->
                <div id="edit-name-form" class="edit-name-form hidden">
                    <input type="text" id="new-username-input" placeholder="Новый ник">
                    <button class="btn-ok" onclick="saveNewName()">OK</button>
                    <button class="btn-ok" style="background:transparent; color:var(--text-muted)" onclick="toggleEditName()">✕</button>
                </div>
            </div>

            <div class="site-id-badge">ID: <span id="display-site-id">0000000000</span></div>

            <div class="profile-info-grid">
                <!-- Блок РАНГА -->
                <div class="info-item">
                    <span class="info-label">РАНГ</span>
                    <img id="rank-medal" src="" alt="Medal" style="display: none;">
                    <span id="display-rank" class="info-value">...</span>
                </div>
                
                <!-- Блок РЕКОРДА -->
                <div class="info-item">
                    <span class="info-label">РЕКОРД INVOKER</span>
                    <div style="height: 70px; display: flex; align-items: center;">
                        <span id="display-score" class="info-value">0</span>
                    </div>
                </div>
            </div>

            <button class="btn-yellow" onclick="openFavModal()">★ ВЫБРАТЬ ЛЮБИМЫХ ГЕРОЕВ</button>
            
            <button id="steam-link-btn" class="btn-secondary" onclick="window.location.href='/api/login/steam'" 
                    style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <i class="fab fa-steam"></i> ПРИВЯЗАТЬ STEAM
            </button>
        </div>
    </main>

    <!-- Модалка выбора героев -->
    <div id="fav-modal" class="modal-overlay hidden">
        <div class="modal-card" style="max-width: 900px;">
            <h3>Ваши любимые герои</h3>
            <input type="text" id="fav-search-input" placeholder="Поиск..." oninput="filterFavHeroes()" 
                   style="background: var(--bg-input); border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 15px;">
            <div id="fav-heroes-container" class="fav-heroes-grid"></div>
            <div style="display: flex; justify-content: flex-end; gap: 15px; margin-top: 20px;">
                <button class="btn-secondary" style="margin:0" onclick="closeFavModal()">Отмена</button>
                <button class="btn-primary" style="margin:0; min-width: 150px;" onclick="saveFavorites()">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/favorites.js"></script>
    
    <script>
        let userSiteId = "";

        async function loadProfile() {
            try {
                const res = await fetch('/api/me');
                const user = await res.json();
                if (!user.logged_in) { window.location.href = '/'; return; }

                userSiteId = user.site_id;
                document.getElementById('display-username').innerHTML = `${user.username} <i class="fas fa-pencil-alt edit-icon" onclick="toggleEditName()"></i>`;
                document.getElementById('user-display-name').innerText = user.username;
                document.getElementById('display-site-id').innerText = user.site_id;
                document.getElementById('display-score').innerText = user.invoker_score || 0;
                
                document.getElementById('profile-avatar').src = user.avatar || "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/pudge.png";
                if (user.is_premium) document.getElementById('premium-badge').classList.remove('hidden');
                if (user.steam_linked) document.getElementById('steam-link-btn').classList.add('hidden');

                const rankNames = ["Unranked", "Herald", "Guardian", "Crusader", "Archon", "Legend", "Ancient", "Divine", "Immortal"];
                const medalImg = document.getElementById('rank-medal');
                const rankVal = document.getElementById('display-rank');
                
                if (user.rank && user.rank > 0) {
                    const medalIndex = Math.floor(user.rank / 10);
                    const stars = user.rank % 10;
                    medalImg.src = `https://www.opendota.com/assets/images/dota2/rank_icons/rank_icon_${medalIndex}.png`;
                    medalImg.style.display = 'block';
                    rankVal.innerText = medalIndex === 8 ? "Immortal" : `${rankNames[medalIndex]} [${stars}]`;
                } else {
                    rankVal.innerText = user.steam_linked ? "Hidden" : "Link Steam";
                }
            } catch (err) { console.error(err); }
        }

        function toggleEditName() {
            document.getElementById('name-display-area').classList.toggle('hidden');
            document.getElementById('edit-name-form').classList.toggle('hidden');
            const currentName = document.getElementById('user-display-name').innerText;
            document.getElementById('new-username-input').value = currentName;
            document.getElementById('new-username-input').focus();
        }

        async function saveNewName() {
            const newName = document.getElementById('new-username-input').value.trim();
            if (!newName) return;
            const res = await fetch('/api/update-username', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ site_id: userSiteId, new_username: newName })
            });
            if (res.ok) location.reload();
            else alert("Этот ник уже занят!");
        }

        window.onload = loadProfile;
    </script>
</body>
</html>
