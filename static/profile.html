<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Профиль — Dota 2 Helper</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body id="body-profile">
    <header>
        <div class="header-left">
            <div class="logo" onclick="window.location.href='/'">Dota 2 Helper</div>
            <nav class="main-nav">
                <button class="nav-link" onclick="window.location.href='/drafts'">АНАЛИЗ ДРАФТОВ</button>
                <button class="nav-link" onclick="window.location.href='/fantasy'">ФЕНТАЗИ ПОМОЩНИК</button>
                <button class="nav-link" onclick="window.location.href='/invoker'">ТРЕНАЖЁР ИНВОКЕР</button>
            </nav>
        </div>
        <div class="user-panel">
            <span id="user-display-name" class="user-badge">...</span>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>
    </header>

    <main>
        <div class="profile-container">
            <div id="premium-badge" class="hidden" style="color: var(--accent-yellow); font-weight: bold; margin-bottom: 10px;">★ PREMIUM АККАУНТ ★</div>
            
            <div style="position: relative; margin-bottom: 15px;">
                <img id="profile-avatar" src="" 
                     style="width:110px; height:110px; border-radius:50%; border: 4px solid var(--accent-red); object-fit: cover;">
            </div>

            <div class="profile-name-row">
                <h2 id="display-username" style="font-size: 2rem; font-weight: 900;">Загрузка...</h2>
                <i class="fas fa-pencil-alt edit-icon" onclick="toggleEditName()" style="cursor: pointer; color: var(--text-muted); margin-left: 10px;"></i>
            </div>
            
            <div id="edit-name-form" class="hidden" style="margin-top: 10px;">
                <input type="text" id="new-username-input" style="background: var(--bg-input); border: 1px solid var(--border-color); color: white; padding: 10px; border-radius: 8px; width: 200px;">
                <button class="btn-primary" onclick="saveNewName()" style="padding: 10px 20px; min-width: auto; margin-left: 5px;">ОК</button>
            </div>

            <div class="site-id-badge">
                ID: <span id="display-site-id">0000000000</span>
            </div>

            <div class="profile-info-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; margin-top: 20px;">
                <div class="info-item" style="background: var(--bg-input); padding: 15px; border-radius: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <div style="color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; margin-bottom: 5px;">Ранг:</div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <!-- КАРТИНКА РАНГА -->
                        <img id="rank-medal" src="" style="width: 45px; height: 45px; display: none; filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));">
                        <b id="display-rank" style="color: var(--accent-red); font-size: 1.1rem;">...</b>
                    </div>
                </div>
                <div class="info-item" style="background: var(--bg-input); padding: 15px; border-radius: 15px; text-align: center;">
                    <div style="color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase;">Рекорд Инвокера:</div>
                    <b id="display-score" style="color: var(--accent-yellow); font-size: 1.2rem; display: block; margin-top: 5px;">0</b>
                </div>
            </div>

            <button class="btn-yellow" onclick="openFavModal()">★ ВЫБРАТЬ ЛЮБИМЫХ ГЕРОЕВ</button>
            
            <button id="steam-link-btn" class="btn-secondary" onclick="window.location.href='/api/login/steam'" 
                    style="width: 100%; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <i class="fab fa-steam"></i> ПРИВЯЗАТЬ STEAM
            </button>
        </div>
    </main>

    <div id="fav-modal" class="modal-overlay hidden">
        <div class="modal-card" style="max-width: 900px;">
            <h3>Ваши любимые герои</h3>
            <input type="text" id="fav-search-input" placeholder="Поиск..." oninput="filterFavHeroes()" 
                   style="background: var(--bg-input); border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 15px;">
            <div id="fav-heroes-container" class="fav-heroes-grid"></div>
            <div style="display: flex; justify-content: flex-end; gap: 15px; margin-top: 20px;">
                <button class="btn-secondary" onclick="closeFavModal()">Отмена</button>
                <button class="btn-primary" onclick="saveFavorites()">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/favorites.js"></script>
    
    <script>
        let userSiteId = "";

        async function loadProfile() {
            try {
                const res = await fetch('/api/me');
                const user = await res.json();
                
                if (!user.logged_in) {
                    window.location.href = '/';
                    return;
                }

                userSiteId = user.site_id;
                document.getElementById('display-username').innerText = user.username;
                document.getElementById('user-display-name').innerText = user.username;
                document.getElementById('display-site-id').innerText = user.site_id;
                document.getElementById('display-score').innerText = user.invoker_score || 0;
                
                if (user.avatar) {
                    document.getElementById('profile-avatar').src = user.avatar;
                } else {
                    document.getElementById('profile-avatar').src = "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/pudge.png";
                }
                
                if (user.is_premium) {
                    document.getElementById('premium-badge').classList.remove('hidden');
                }
                
                if (user.steam_linked) {
                    document.getElementById('steam-link-btn').classList.add('hidden');
                }

                // ЛОГИКА РАНГА И КАРТИНКИ
                const rankNames = ["Unranked", "Herald", "Guardian", "Crusader", "Archon", "Legend", "Ancient", "Divine", "Immortal"];
                const medalImg = document.getElementById('rank-medal');
                const rankText = document.getElementById('display-rank');
                
                if (user.rank && user.rank > 0) {
                    const medalIndex = Math.floor(user.rank / 10);
                    const stars = user.rank % 10;
                    
                    // Показываем медаль
                    medalImg.src = `https://www.opendota.com/assets/images/dota2/rank_icons/rank_icon_${medalIndex}.png`;
                    medalImg.style.display = 'block';

                    if (medalIndex === 8) {
                        rankText.innerText = "Immortal";
                    } else {
                        rankText.innerText = `${rankNames[medalIndex]} [${stars}]`;
                    }
                } else {
                    medalImg.style.display = 'none';
                    rankText.innerText = user.steam_linked ? "Hidden" : "Link Steam";
                }

            } catch (err) {
                console.error("Ошибка загрузки профиля:", err);
            }
        }

        function toggleEditName() {
            document.getElementById('display-username').classList.toggle('hidden');
            document.getElementById('edit-name-form').classList.toggle('hidden');
            document.getElementById('new-username-input').value = document.getElementById('display-username').innerText;
        }

        async function saveNewName() {
            const newName = document.getElementById('new-username-input').value.trim();
            if (!newName) return;
            const res = await fetch('/api/update-username', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ site_id: userSiteId, new_username: newName })
            });
            if (res.ok) {
                location.reload();
            } else {
                alert("Этот ник уже занят!");
            }
        }

        window.onload = loadProfile;
    </script>
</body>
</html>
