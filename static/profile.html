<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Профиль — Dota 2 Helper</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body id="body-profile">
    <header>
        <div class="header-left">
            <div class="logo" onclick="window.location.href='/'">Dota 2 Helper</div>
            <nav class="main-nav">
                <button class="nav-link" onclick="window.location.href='/drafts'">АНАЛИЗ ДРАФТОВ</button>
                <button class="nav-link" onclick="window.location.href='/fantasy'">ФЕНТАЗИ ПОМОЩНИК</button>
                <button class="nav-link" onclick="window.location.href='/invoker'">ТРЕНАЖЁР ИНВОКЕР</button>
            </nav>
        </div>
        <div class="user-panel">
            <span id="user-display-name" class="user-badge">...</span>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>
    </header>

    <main>
        <div class="profile-container">
            <img id="profile-avatar" src="" style="width:110px; height:110px; border-radius:50%; border: 4px solid var(--accent-red); object-fit: cover;">

            <div style="text-align: center;">
                <h2 id="display-username" style="font-size: 2.2rem; font-weight: 900; display: inline-block;">...</h2>
                <i class="fas fa-pencil-alt" onclick="toggleEditName()" style="cursor: pointer; color: var(--text-muted); margin-left: 10px;"></i>
                <div id="edit-name-form" class="hidden" style="margin-top: 10px;">
                    <input type="text" id="new-username-input" style="background: var(--bg-input); border: 1px solid var(--border-color); color: white; padding: 8px; border-radius: 5px;">
                    <button class="btn-primary" onclick="saveNewName()" style="padding: 8px 15px; min-width: auto;">OK</button>
                </div>
            </div>

            <div style="background: var(--bg-input); padding: 5px 15px; border-radius: 20px; font-family: monospace; font-size: 0.8rem; border: 1px solid var(--border-color);">
                ID: <span id="display-site-id">0000000000</span>
            </div>

            <div class="profile-info-grid">
                <div class="info-item">
                    <span class="info-label">РАНГ</span>
                    <img id="rank-medal" src="" style="width: 55px; height: 55px; display: none;">
                    <span id="display-rank" class="info-value">...</span>
                </div>
                <div class="info-item">
                    <span class="info-label">РЕКОРД INVOKER</span>
                    <div style="height: 55px; display: flex; align-items: center;">
                        <span id="display-score" class="info-value">0</span>
                    </div>
                </div>
            </div>

            <button class="btn-yellow" onclick="openFavModal()">★ ВЫБРАТЬ ЛЮБИМЫХ ГЕРОЕВ</button>
            
            <button id="steam-link-btn" class="btn-secondary" onclick="window.location.href='/api/login/steam'" style="width: 100%;">
                <i class="fab fa-steam"></i> ПРИВЯЗАТЬ STEAM
            </button>
        </div>
    </main>

    <div id="fav-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Ваши любимые герои</h3>
            <input type="text" id="fav-search-input" placeholder="Поиск героя..." oninput="filterFavHeroes()" 
                   style="background: var(--bg-input); border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 10px; width: 100%; margin: 15px 0;">
            <div id="fav-heroes-container" class="fav-heroes-grid"></div>
            <div style="display: flex; justify-content: flex-end; gap: 15px; margin-top: 20px;">
                <button class="btn-secondary" onclick="closeFavModal()">Отмена</button>
                <button class="btn-primary" onclick="saveFavorites()">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/favorites.js"></script>
    <script>
        let userSiteId = "";
        async function loadProfile() {
            const res = await fetch('/api/me');
            const user = await res.json();
            if (!user.logged_in) { window.location.href = '/'; return; }
            userSiteId = user.site_id;
            document.getElementById('display-username').innerText = user.username;
            document.getElementById('user-display-name').innerText = user.username;
            document.getElementById('display-site-id').innerText = user.site_id;
            document.getElementById('display-score').innerText = user.invoker_score;
            document.getElementById('profile-avatar').src = user.avatar || "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/pudge.png";
            if (user.steam_linked) document.getElementById('steam-link-btn').classList.add('hidden');
            const rankNames = ["Unranked", "Herald", "Guardian", "Crusader", "Archon", "Legend", "Ancient", "Divine", "Immortal"];
            const medalImg = document.getElementById('rank-medal');
            const rankVal = document.getElementById('display-rank');
            if (user.rank > 0) {
                const medalIndex = Math.floor(user.rank / 10);
                const stars = user.rank % 10;
                medalImg.src = `https://www.opendota.com/assets/images/dota2/rank_icons/rank_icon_${medalIndex}.png`;
                medalImg.style.display = 'block';
                rankVal.innerText = medalIndex === 8 ? "Immortal" : `${rankNames[medalIndex]} [${stars}]`;
            } else {
                rankVal.innerText = user.steam_linked ? "Hidden" : "Link Steam";
            }
        }
        function toggleEditName() {
            document.getElementById('display-username').classList.toggle('hidden');
            document.getElementById('edit-name-form').classList.toggle('hidden');
            document.getElementById('new-username-input').value = document.getElementById('display-username').innerText;
        }
        async function saveNewName() {
            const newName = document.getElementById('new-username-input').value;
            const res = await fetch('/api/update-username', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ site_id: userSiteId, new_username: newName })
            });
            if (res.ok) location.reload();
            else alert("Никнейм занят!");
        }
        window.onload = loadProfile;
    </script>
</body>
</html>
