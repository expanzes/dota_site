<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Dota 2 Helper</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body id="body-profile">
    <header>
        <div class="header-left">
            <div class="logo" onclick="window.location.href='/'">DOTA HELPER</div>
            <nav class="main-nav">
                <button class="nav-link" onclick="window.location.href='/drafts'">АНАЛИЗ ДРАФТОВ</button>
                <button class="nav-link" onclick="window.location.href='/fantasy'">ФЕНТАЗИ ПОМОЩНИК</button>
                <button class="nav-link" onclick="window.location.href='/invoker'">ТРЕНАЖЁР ИНВОКЕР</button>
            </nav>
        </div>
        <div class="user-panel">
            <span id="user-display-name" class="user-badge" onclick="window.location.href='/profile'" style="cursor: pointer; transition: 0.2s;" onmouseover="this.style.color='var(--accent-yellow)'" onmouseout="this.style.color=''">...</span>
            <button class="btn-friends" onclick="toggleSidebar()"><i class="fas fa-user-friends"></i> ДРУЗЬЯ</button>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>
    </header>

    <div id="friends-sidebar" class="friends-sidebar">
        <div class="sidebar-header">
            <h3>Социальная сеть</h3>
            <button class="close-sidebar" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
        </div>
        <input type="text" id="friend-search-input" class="search-input" placeholder="Найти по нику..." oninput="handleSearch()">
        <div id="sidebar-content">
            <div id="search-results" style="display: none;"></div>
            <div id="default-lists">
                <div id="pending-list" style="display: none;"></div>
                <div id="friends-list"></div>
            </div>
        </div>
    </div>

    <main>
        <div class="profile-container">
            <button id="back-to-my-profile" onclick="window.location.href='/profile'"><i class="fas fa-arrow-left"></i> Вернуться в свой профиль</button>

            <div class="avatar-wrapper">
                <img id="profile-avatar" src="" alt="avatar">
                <label for="avatar-input" class="avatar-edit-overlay owner-only" title="Сменить аватар">
                    <i class="fas fa-camera"></i>
                </label>
                <input type="file" id="avatar-input" accept="image/*" style="display: none;" onchange="handleAvatarUpload(event)">
            </div>

            <div id="status-container" style="margin-top: -15px;">
                <span id="display-online-status" class="status-text-online">В СЕТИ</span>
            </div>

            <div style="text-align: center; width: 100%;">
                <h2 id="display-username" style="font-size: 2.5rem; font-weight: 900; display: inline-block; margin-bottom: 0;">...</h2>
                <i id="edit-name-icon" class="fas fa-pencil-alt edit-icon owner-only" onclick="toggleEditName()"></i>
                
                <div id="edit-name-form" class="hidden owner-only" style="margin-top: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
                    <div id="rename-warning" style="display: none; color: var(--accent-yellow); font-weight: 900; font-size: 1rem; text-transform: uppercase;">
                        <i class="fas fa-exclamation-triangle"></i> Пожалуйста, смените никнейм для корректного отображения!
                    </div>
                    
                    <div style="display: flex; gap: 10px; justify-content: center; align-items: center;">
                        <input type="text" id="new-username-input" placeholder="Введите новый ник..." maxlength="15" 
                               title="Только английские буквы, цифры, подчеркивание и одиночные пробелы (3-15 символов)"
                               style="background: var(--bg-input); border: 2px solid var(--border-color); color: white; padding: 15px 25px; border-radius: 12px; font-size: 1.2rem; font-weight: bold; width: 250px; text-align: center; outline: none;">
                        <button class="btn-ok" onclick="saveNewName()">OK</button>
                    </div>
                    
                    <div style="color: var(--text-muted); font-size: 0.85rem; font-weight: 700; margin-top: 5px;">
                        *От 3 до 15 символов. Разрешены только английские буквы, цифры, " _ " и одиночные пробелы.
                    </div>
                </div>
            </div>

            <div class="site-id-badge">
                ID: <span id="display-site-id">0000000000</span>
            </div>

            <div class="profile-info-grid">
                <div class="info-item">
                    <span class="info-label">РАНГ</span>
                    <img id="rank-medal" src="" style="width: 75px; height: 75px; display: none;">
                    <span id="display-rank" class="info-value">...</span>
                </div>
                <div class="info-item">
                    <span class="info-label">РЕКОРД INVOKER</span>
                    <div style="height: 75px; display: flex; align-
