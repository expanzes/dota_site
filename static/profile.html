<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль — Dota Helper</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .profile-container { max-width: 800px; margin: 40px auto; padding: 20px; background: var(--bg-secondary); border-radius: 15px; text-align: center; }
        .avatar-lg { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--accent-yellow); object-fit: cover; margin-bottom: 15px; }
        .site-id-badge { background: var(--bg-input); padding: 5px 15px; border-radius: 20px; color: var(--text-muted); font-size: 0.9rem; display: inline-block; margin-top: 10px; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-card { background: var(--bg-secondary); padding: 30px; border-radius: 12px; width: 350px; text-align: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body id="body-dark">

    <header>
        <div class="header-left">
            <div class="logo" onclick="window.location.href='/'">DOTA HELPER</div>
            <nav class="main-nav">
                <button class="nav-link" onclick="window.location.href='/drafts'">АНАЛИЗ ДРАФТОВ</button>
            </nav>
        </div>
        <div class="user-panel">
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>
    </header>

    <div class="profile-container">
        <img id="prof-avatar" src="/static/images/default_avatar.png" class="avatar-lg">
        <h1 id="prof-username">Загрузка...</h1>
        <div class="site-id-badge">ID: <span id="prof-site-id">---</span></div>
        
        <div style="margin-top: 20px;">
            <button class="btn-secondary" onclick="window.location.href='/api/login/steam'" id="btn-link-steam">Привязать Steam</button>
        </div>

        <!-- Настройки безопасности -->
        <div class="security-settings" style="margin-top: 30px; background: var(--bg-input); padding: 20px; border-radius: 12px; text-align: left;">
            <h3 style="margin-bottom: 15px; font-size: 1rem; color: var(--text-muted); text-transform: uppercase;">Настройки безопасности</h3>

            <div style="margin-bottom: 15px;">
                <span style="color: #888; font-size: 0.85rem;">Привязанный E-mail</span>
                <div style="display: flex; justify-content: space-between; align-items: center; background: #111; padding: 10px; border-radius: 8px; margin-top: 5px;">
                    <span id="display-email" style="font-weight: bold; word-break: break-all;">Загрузка...</span>
                    <button class="btn-secondary" style="padding: 5px 15px; font-size: 0.8rem;" onclick="openSecurityModal('email')">Изменить</button>
                </div>
            </div>

            <div>
                <span style="color: #888; font-size: 0.85rem;">Пароль</span>
                <div style="display: flex; justify-content: space-between; align-items: center; background: #111; padding: 10px; border-radius: 8px; margin-top: 5px;">
                    <span style="font-weight: bold; letter-spacing: 2px;">********</span>
                    <button class="btn-secondary" style="padding: 5px 15px; font-size: 0.8rem;" onclick="openSecurityModal('password')">Изменить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно для смены данных -->
    <div id="security-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3 id="sec-modal-title">Изменение данных</h3>
            <div id="sec-step-1">
                <p style="color: #aaa; font-size: 0.9rem; margin-bottom: 15px;">Мы отправим код подтверждения на вашу текущую почту.</p>
                <button class="btn-primary" style="width: 100%;" onclick="requestSecurityCode()">Получить код</button>
            </div>
            <div id="sec-step-2" class="hidden">
                <p style="color: #aaa; font-size: 0.9rem; margin-bottom: 15px;">Введите код из письма и новые данные.</p>
                <input type="text" id="sec-code" placeholder="000000" maxlength="6" style="background: #111; color: white; padding: 10px; border-radius: 8px; width: 100%; text-align: center; font-size: 1.5rem; letter-spacing: 5px; margin-bottom: 10px; border: 1px solid #333;">
                
                <input type="email" id="sec-new-email" placeholder="Новый E-mail" style="background: #111; color: white; padding: 10px; border-radius: 8px; width: 100%; margin-bottom: 10px; border: 1px solid #333; box-sizing: border-box;" class="hidden">
                <input type="password" id="sec-new-password" placeholder="Новый пароль" style="background: #111; color: white; padding: 10px; border-radius: 8px; width: 100%; margin-bottom: 10px; border: 1px solid #333; box-sizing: border-box;" class="hidden">
                
                <button class="btn-primary" style="width: 100%; margin-top: 10px;" onclick="submitSecurityChange()">Сохранить</button>
            </div>
            <div id="sec-error" style="color: #ff4444; margin-top: 10px; display: none; font-size: 0.9rem;"></div>
            <button class="btn-secondary" style="width: 100%; margin-top: 10px;" onclick="closeSecurityModal()">Отмена</button>
        </div>
    </div>

    <script>
        let currentSecurityMode = '';

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/me');
                const user = await res.json();
                if (!user.logged_in) {
                    window.location.href = '/auth';
                    return;
                }
                
                document.getElementById('prof-username').innerText = user.username;
                document.getElementById('prof-site-id').innerText = user.site_id;
                document.getElementById('display-email').innerText = user.email || 'Не привязана';
                
                if (user.avatar) document.getElementById('prof-avatar').src = user.avatar;
                if (user.steam_linked) {
                    document.getElementById('btn-link-steam').style.display = 'none';
                }
            } catch(e) {}
        });

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/auth';
        }

        function openSecurityModal(mode) {
            currentSecurityMode = mode;
            document.getElementById('sec-modal-title').innerText = mode === 'email' ? 'Смена почты' : 'Смена пароля';
            document.getElementById('sec-step-1').classList.remove('hidden');
            document.getElementById('sec-step-2').classList.add('hidden');
            document.getElementById('sec-error').style.display = 'none';
            document.getElementById('sec-code').value = '';
            document.getElementById('security-modal').classList.remove('hidden');
        }

        function closeSecurityModal() {
            document.getElementById('security-modal').classList.add('hidden');
        }

        async function requestSecurityCode() {
            try {
                const res = await fetch('/api/security/request-code', {method: 'POST'});
                if(res.ok) {
                    document.getElementById('sec-step-1').classList.add('hidden');
                    document.getElementById('sec-step-2').classList.remove('hidden');
                    document.getElementById('sec-new-email').classList.toggle('hidden', currentSecurityMode !== 'email');
                    document.getElementById('sec-new-password').classList.toggle('hidden', currentSecurityMode !== 'password');
                } else {
                    const err = await res.json();
                    document.getElementById('sec-error').innerText = err.detail || "Ошибка";
                    document.getElementById('sec-error').style.display = 'block';
                }
            } catch(e) {}
        }

        async function submitSecurityChange() {
            const code = document.getElementById('sec-code').value.trim();
            const newValue = currentSecurityMode === 'email' ? document.getElementById('sec-new-email').value.trim() : document.getElementById('sec-new-password').value;
            
            if(code.length !== 6 || !newValue) {
                document.getElementById('sec-error').innerText = "Заполните все поля";
                document.getElementById('sec-error').style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`/api/security/change-${currentSecurityMode}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code: code, new_value: newValue})
                });
                if(res.ok) window.location.reload();
                else {
                    const err = await res.json();
                    document.getElementById('sec-error').innerText = err.detail || "Ошибка";
                    document.getElementById('sec-error').style.display = 'block';
                }
            } catch(e) {}
        }
    </script>
</body>
</html>
