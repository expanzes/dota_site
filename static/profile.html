<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль — Dota Helper</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body id="body-dark">

    <header>
        <div class="header-left">
            <div class="logo" onclick="window.location.href='/'">DOTA HELPER</div>
            <nav class="main-nav">
                <button class="nav-link" onclick="window.location.href='/drafts'">АНАЛИЗ ДРАФТОВ</button>
                <button class="nav-link" onclick="window.location.href='/fantasy'">ФЕНТАЗИ ПОМОЩНИК</button>
                <button class="nav-link" onclick="window.location.href='/invoker'">ТРЕНАЖЁР ИНВОКЕР</button>
            </nav>
        </div>
        <div class="user-panel">
            <button class="btn-friends" onclick="toggleFriendsSidebar()">
                <i class="fas fa-user-friends"></i> Друзья
            </button>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>
    </header>

    <div class="profile-container">
        
        <h1 class="profile-main-title">ПРОФИЛЬ ИГРОКА</h1>

        <div class="avatar-wrapper" onclick="document.getElementById('avatar-upload').click()">
            <img id="profile-avatar" src="/static/images/default_avatar.png" alt="Avatar">
            <div class="avatar-edit-overlay"><i class="fas fa-camera"></i></div>
            <input type="file" id="avatar-upload" class="hidden" accept="image/*" onchange="uploadAvatar(this)">
        </div>

        <div class="profile-name-row">
            <div id="display-username" class="skeleton skeleton-text" style="width: 200px; height: 40px;"></div>
            <i class="fas fa-pen edit-icon" onclick="openNameEditor()" id="btn-edit-name" style="display:none;"></i>
        </div>

        <form id="edit-name-form" class="hidden" onsubmit="submitNameChange(event)">
            <input type="text" id="new-username-input" placeholder="Новый ник..." minlength="3" maxlength="15" autocomplete="off">
            <button type="submit" class="btn-ok">OK</button>
        </form>
        <div id="name-error" style="color: var(--accent-red); display: none; font-size: 0.9rem; margin-top: -5px;"></div>

        <div class="site-id-badge">ID: <span id="display-site-id">---</span></div>
        <button class="btn-yellow" id="btn-link-steam" style="display: none; max-width: 300px;" onclick="window.location.href='/api/login/steam'">Привязать Steam</button>

        <div class="profile-info-grid">
            <div class="info-item">
                <div class="info-label">МЕДАЛЬ (STEAM)</div>
                <img id="rank-medal" src="" style="display: none;">
                <div class="info-value" id="display-rank"></div>
            </div>
            <div class="info-item">
                <div class="info-label">РЕКОРД INVOKER</div>
                <div class="info-value" id="display-score">0</div>
            </div>
        </div>

        <!-- Любимые герои -->
        <div style="width: 100%; text-align: center; margin-top: 10px;">
            <div class="info-label" style="margin-bottom: 15px;">ЛЮБИМЫЕ ГЕРОИ (3)</div>
            <div class="fav-heroes-container" id="fav-heroes-container">
                <div class="fav-hero-slot skeleton"></div>
                <div class="fav-hero-slot skeleton"></div>
                <div class="fav-hero-slot skeleton"></div>
            </div>
            <button class="btn-friends" style="margin: 15px auto 0;" onclick="openHeroesModal()">Выбрать героев</button>
        </div>

        <!-- Настройки безопасности -->
        <div style="width: 100%; border-top: 1px solid var(--border-color); padding-top: 25px; margin-top: 10px;">
            <div class="info-label" style="margin-bottom: 15px;">БЕЗОПАСНОСТЬ</div>
            
            <div class="sec-row">
                <div>
                    <span class="sec-label">E-mail</span>
                    <span id="display-email" style="color: white; font-weight: 600;">...</span>
                </div>
                <button class="btn-friends" onclick="openSecurityModal('email')">Изменить</button>
            </div>
            
            <div class="sec-row">
                <div>
                    <span class="sec-label">Пароль</span>
                    <span style="color: white; font-weight: 800; letter-spacing: 3px;">********</span>
                </div>
                <button class="btn-friends" onclick="openSecurityModal('password')">Изменить</button>
            </div>
        </div>

        <!-- История матчей -->
        <div style="width: 100%; border-top: 1px solid var(--border-color); padding-top: 25px; margin-top: 10px;">
            <div class="info-label" style="margin-bottom: 20px;">ПОСЛЕДНИЕ МАТЧИ</div>
            <div id="matches-list">
                <div class="match-row skeleton" style="height: 65px;"></div>
                <div class="match-row skeleton" style="height: 65px;"></div>
                <div class="match-row skeleton" style="height: 65px;"></div>
            </div>
        </div>

    </div>

    <!-- Боковое меню Друзей -->
    <div id="friends-sidebar" class="friends-sidebar">
        <div class="sidebar-header">
            <h3>Социальная сеть</h3>
            <button class="close-sidebar" onclick="toggleFriendsSidebar()"><i class="fas fa-times"></i></button>
        </div>
        <button id="back-to-my-profile" onclick="backToMyProfile()">Вернуться в мой профиль</button>
        <input type="text" id="friend-search-input" class="search-input" placeholder="Поиск по никнейму..." oninput="searchUsers()">
        <div id="search-results-list"></div>
        <div id="pending-requests-section" style="display: none;">
            <div class="friend-section-title" style="color: var(--accent-yellow);">Заявки</div>
            <div id="pending-requests-list"></div>
        </div>
        <div class="friend-section-title">Мои друзья</div>
        <div id="friends-list"></div>
    </div>

    <!-- Модальное окно: Безопасность -->
    <div id="security-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3 id="sec-modal-title" style="margin-bottom: 20px; color: var(--accent-yellow); font-weight: 900; text-transform: uppercase;">Изменение данных</h3>
            <div id="sec-step-1">
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">На вашу текущую почту будет отправлен 6-значный код.</p>
                <button class="btn-yellow" onclick="requestSecurityCode()">Получить код</button>
            </div>
            <div id="sec-step-2" class="hidden">
                <input type="text" id="sec-code" class="modal-input" placeholder="000000" maxlength="6" style="text-align: center; font-size: 1.5rem; letter-spacing: 5px;">
                <input type="email" id="sec-new-email" class="modal-input hidden" placeholder="Новый E-mail">
                <input type="password" id="sec-new-password" class="modal-input hidden" placeholder="Новый пароль">
                <button class="btn-yellow" style="margin-top: 10px;" onclick="submitSecurityChange()">Сохранить</button>
            </div>
            <div id="sec-error" style="color: var(--accent-red); margin-top: 15px; display: none; font-size: 0.9rem; font-weight: bold;"></div>
            <button class="btn-friends" style="width: 100%; justify-content: center; margin-top: 15px;" onclick="closeSecurityModal()">Отмена</button>
        </div>
    </div>

    <!-- Модальное окно: Выбор героев -->
    <div id="heroes-modal" class="modal-overlay hidden">
        <div class="modal-card" style="width: 600px; max-width: 90vw; max-height: 85vh; display: flex; flex-direction: column;">
            <h3 style="margin-bottom: 15px; color: var(--accent-yellow); font-weight: 900;">ВЫБЕРИТЕ ЛЮБИМЫХ ГЕРОЕВ</h3>
            <input type="text" id="hero-search" class="modal-input" placeholder="Поиск героя..." oninput="filterHeroes()">
            <div id="heroes-grid" class="fav-heroes-grid"></div>
            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <button class="btn-yellow" style="flex: 1;" onclick="saveHeroes()">Сохранить</button>
                <button class="btn-friends" style="flex: 1; justify-content: center;" onclick="closeHeroesModal()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Подключение скриптов -->
    <script src="/static/js/profile_matches.js"></script>
    <script src="/static/js/profile_heroes.js"></script>
    <script src="/static/js/profile_friends.js"></script>
    <script src="/static/js/profile_main.js"></script>
</body>
</html>
