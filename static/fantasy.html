<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicons/favicon-16x16.png">
<link rel="manifest" href="/static/favicons/site.webmanifest">
    <meta charset="UTF-8"><link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <header>
        <div class="header-left"><div class="logo" onclick="window.location.href='/'">DOTA HELPER</div>
        <nav class="main-nav">
            <button class="nav-link" onclick="window.location.href='/drafts'">АНАЛИЗ ДРАФТОВ</button>
            <button class="nav-link active" onclick="window.location.href='/fantasy'">ФЕНТАЗИ ПОМОЩНИК</button>
            <button class="nav-link" onclick="window.location.href='/invoker'">ТРЕНАЖЁР ИНВОКЕР</button>
        </nav></div>
    </header>
    <main style="text-align:center; padding-top:100px;"><h1>ФЕНТАЗИ ПОМОЩНИК</h1><p>В разработке...</p></main>
    <script src="/static/js/auth.js"></script>
    <script>
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await fetch('/api/me');
            const user = await res.json();
            
            if (user.logged_in) {
                // Скрипт ищет твой ID с 26-й строки
                const headerUsername = document.getElementById('user-display-name');
                if (headerUsername) {
                    let nameHtml = user.username;
                    if (user.is_premium) {
                        nameHtml += ' <i class="fas fa-crown" style="color: #FFD700; margin-left: 5px;" title="Premium"></i>';
                    }
                    headerUsername.innerHTML = nameHtml;
                }
            } else {
                window.location.href = '/auth';
            }
        } catch (e) {
            console.error("Ошибка загрузки профиля:", e);
        }
    });

    async function logout() {
        try { await fetch('/api/logout', { method: 'POST' }); } catch (e) {}
        window.location.href = '/auth';
    }
</script>
</body>
</html>
