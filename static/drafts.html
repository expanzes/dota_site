<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализ — Dota 2 Helper</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body id="body-drafts">
    <div id="main-app">
        <header>
            <div class="logo" onclick="window.location.href='/'">Dota 2 Helper</div>
            <nav class="main-nav">
                <button class="nav-link active" onclick="window.location.href='/drafts'">АНАЛИЗ ДРАФТОВ</button>
                <button class="nav-link" onclick="window.location.href='/invoker'">ТРЕНАЖЁР</button>
            </nav>
            <div id="user-display-name" style="font-weight:bold; font-size:0.8rem; cursor:pointer" onclick="window.location.href='/profile'">Загрузка...</div>
        </header>

        <main>
            <div class="draft-container">
                <div class="team-box allies">
                    <h3 style="text-align:center; color:var(--accent-green); margin-bottom:20px;">Моя команда</h3>
                    <div class="inputs-grid">
                        <div class="input-field-group"><label>КЕРРИ</label><div class="hero-slot"><img src="" class="slot-hero-img" id="img-my-pos1"><input type="text" id="my-pos1" placeholder="Выбрать..."></div></div>
                        <div class="input-field-group"><label>МИД</label><div class="hero-slot"><img src="" class="slot-hero-img" id="img-my-pos2"><input type="text" id="my-pos2" placeholder="Выбрать..."></div></div>
                        <div class="input-field-group"><label>ТРОЙКА</label><div class="hero-slot"><img src="" class="slot-hero-img" id="img-my-pos3"><input type="text" id="my-pos3" placeholder="Выбрать..."></div></div>
                        <div class="input-field-group"><label>ЧЕТВЕРКА</label><div class="hero-slot"><img src="" class="slot-hero-img" id="img-my-pos4"><input type="text" id="my-pos4" placeholder="Выбрать..."></div></div>
                        <div class="input-field-group"><label>ПЯТЕРКА</label><div class="hero-slot"><img src="" class="slot-hero-img" id="img-my-pos5"><input type="text" id="my-pos5" placeholder="Выбрать..."></div></div>
                    </div>
                </div>
                <div class="team-box enemies">
                    <h3 style="text-align:center; color:var(--accent-red); margin-bottom:20px;">Команда противника</h3>
                    <div class="inputs-grid">
                        <div class="input-field-group"><label>ВРАГ 1</label><div class="hero-slot"><img src="" class="slot-hero-img" id="img-enemy-1"><input type="text" id="enemy-1" placeholder="Выбрать..."></div></div>
                        <div class="input-field-group"><label>ВРАГ 2</label><div class="hero-slot"><img src="" class="slot-hero-img" id="img-enemy-2"><input type="text" id="enemy-2" placeholder="Выбрать..."></div></div>
                        <div class="input-field-group"><label>ВРАГ 3</label><div class="hero-slot"><img src="" class="slot-hero-img" id="img-enemy-3"><input type="text" id="enemy-3" placeholder="Выбрать..."></div></div>
                        <div class="input-field-group"><label>ВРАГ 4</label><div class="hero-slot"><img src="" class="slot-hero-img" id="img-enemy-4"><input type="text" id="enemy-4" placeholder="Выбрать..."></div></div>
                        <div class="input-field-group"><label>ВРАГ 5</label><div class="hero-slot"><img src="" class="slot-hero-img" id="img-enemy-5"><input type="text" id="enemy-5" placeholder="Выбрать..."></div></div>
                    </div>
                </div>
            </div>

            <div class="actions-row">
                <button class="btn-main" style="flex:2" onclick="analyzeDraft()">Проанализировать</button>
                <button class="btn-sub" style="flex:1" onclick="clearInputs()">Очистить</button>
                <div class="ui-help-wrapper" style="flex:1">
                    <button class="btn-sub">Помощь</button>
                    <div class="ui-tooltip">
                        <div style="color:var(--accent-red); font-weight:900; margin-bottom:10px;">КАК ЭТО РАБОТАЕТ?</div>
                        <p style="font-size:0.7rem; color:var(--text-muted); line-height:1.4;">
                            Используем нейро-анализ 50,000+ матчей Immortal-ранга. Учитываем контрпики, синергию и баланс ролей.
                        </p>
                    </div>
                </div>
            </div>
            <div id="results-container"></div>
        </main>
    </div>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/draft.js"></script>
</body>
</html>
