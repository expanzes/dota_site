<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализ Драфтов — Dota 2 Helper</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body id="body-drafts">
    <div id="main-app">
        <header>
            <div class="header-left">
                <div class="logo" onclick="window.location.href='/'">Dota 2 Helper</div>
                <nav class="main-nav">
                    <button class="nav-link active" onclick="window.location.href='/drafts'">АНАЛИЗ ДРАФТОВ</button>
                    <button class="nav-link" onclick="window.location.href='/fantasy'">ФЕНТАЗИ ПОМОЩНИК</button>
                    <button class="nav-link" onclick="window.location.href='/invoker'">ТРЕНАЖЁР ИНВОКЕР</button>
                </nav>
            </div>
            <div class="user-panel">
                <span id="user-display-name" class="user-badge" onclick="window.location.href='/profile'">Загрузка...</span>
                <button class="btn-logout" onclick="logout()">Выйти</button>
            </div>
        </header>

        <main>
            <div class="draft-container">
                <!-- МОЯ КОМАНДА -->
                <div class="team-box allies">
                    <h3 class="allies-title">Моя команда</h3>
                    <div class="inputs-grid">
                        <div class="input-field-group"><label>КЕРРИ</label><div class="hero-slot" id="cont-my-pos1"><img src="" class="slot-hero-img" id="img-my-pos1"><input type="text" id="my-pos1" placeholder="Выбрать..." autocomplete="off"></div></div>
                        <div class="input-field-group"><label>МИД</label><div class="hero-slot" id="cont-my-pos2"><img src="" class="slot-hero-img" id="img-my-pos2"><input type="text" id="my-pos2" placeholder="Выбрать..." autocomplete="off"></div></div>
                        <div class="input-field-group"><label>ТРОЙКА</label><div class="hero-slot" id="cont-my-pos3"><img src="" class="slot-hero-img" id="img-my-pos3"><input type="text" id="my-pos3" placeholder="Выбрать..." autocomplete="off"></div></div>
                        <div class="input-field-group"><label>ЧЕТВЕРКА</label><div class="hero-slot" id="cont-my-pos4"><img src="" class="slot-hero-img" id="img-my-pos4"><input type="text" id="my-pos4" placeholder="Выбрать..." autocomplete="off"></div></div>
                        <div class="input-field-group"><label>ПЯТЕРКА</label><div class="hero-slot" id="cont-my-pos5"><img src="" class="slot-hero-img" id="img-my-pos5"><input type="text" id="my-pos5" placeholder="Выбрать..." autocomplete="off"></div></div>
                    </div>
                </div>

                <!-- КОМАНДА ПРОТИВНИКА -->
                <div class="team-box enemies">
                    <h3 class="enemies-title">Команда противника</h3>
                    <div class="inputs-grid">
                        <div class="input-field-group"><label>ВРАГ 1</label><div class="hero-slot" id="cont-enemy-1"><img src="" class="slot-hero-img" id="img-enemy-1"><input type="text" id="enemy-1" placeholder="Выбрать..." autocomplete="off"></div></div>
                        <div class="input-field-group"><label>ВРАГ 2</label><div class="hero-slot" id="cont-enemy-2"><img src="" class="slot-hero-img" id="img-enemy-2"><input type="text" id="enemy-2" placeholder="Выбрать..." autocomplete="off"></div></div>
                        <div class="input-field-group"><label>ВРАГ 3</label><div class="hero-slot" id="cont-enemy-3"><img src="" class="slot-hero-img" id="img-enemy-3"><input type="text" id="enemy-3" placeholder="Выбрать..." autocomplete="off"></div></div>
                        <div class="input-field-group"><label>ВРАГ 4</label><div class="hero-slot" id="cont-enemy-4"><img src="" class="slot-hero-img" id="img-enemy-4"><input type="text" id="enemy-4" placeholder="Выбрать..." autocomplete="off"></div></div>
                        <div class="input-field-group"><label>ВРАГ 5</label><div class="hero-slot" id="cont-enemy-5"><img src="" class="slot-hero-img" id="img-enemy-5"><input type="text" id="enemy-5" placeholder="Выбрать..." autocomplete="off"></div></div>
                    </div>
                </div>
            </div>

            <div class="actions-row">
                <button class="btn-primary" onclick="analyzeDraft()" style="flex: 2;">ПРОАНАЛИЗИРОВАТЬ ДРАФТ</button>
                <button class="btn-secondary" onclick="clearInputs()" style="flex: 1;">ОЧИСТИТЬ</button>
            </div>

            <div id="results-container"></div>
        </main>
    </div>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/draft.js"></script>
</body>
</html>
