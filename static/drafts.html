<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>Анализ Драфтов — Dota 2 Helper</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div id="main-app">
        <header>
            <div class="header-left">
                <div class="logo" onclick="window.location.href='/'">Dota 2 Helper</div>
                <nav class="main-nav">
                    <button class="nav-link active" onclick="window.location.href='/drafts'">АНАЛИЗ ДРАФТОВ</button>
                    <button class="nav-link" onclick="window.location.href='/fantasy'">ФЕНТАЗИ ПОМОЩНИК</button>
                    <button class="nav-link" onclick="window.location.href='/invoker'">ТРЕНАЖЁР ИНВОКЕР</button>
                </nav>
            </div>
            <div class="user-panel">
                <span id="user-display-name" class="user-badge" onclick="window.location.href='/profile'">Загрузка...</span>
                <button class="btn-logout" onclick="logout()">Выйти</button>
            </div>
        </header>
        <main>
            <div class="draft-container">
                <div class="team-box">
                    <h3 style="color: var(--accent-green); margin-bottom: 15px;">Моя команда</h3>
                    <div class="inputs-grid" id="allies-inputs"></div>
                </div>
                <div class="team-box">
                    <h3 style="color: var(--accent-red); margin-bottom: 15px;">Враги</h3>
                    <div class="inputs-grid" id="enemies-inputs"></div>
                </div>
            </div>
            <button class="btn-analyze" onclick="analyzeDraft()">ПРОАНАЛИЗИРОВАТЬ ДРАФТ</button>
            <button onclick="clearInputs()" style="width: 100%; background: transparent; color: var(--text-muted); border: none; margin-top: 10px; cursor: pointer;">Очистить всё</button>
            <div id="results-container"></div>
        </main>
    </div>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/draft.js"></script>
</body>
</html>
