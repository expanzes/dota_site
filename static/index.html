<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota 2 Helper</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <div id="welcome-screen">
    <div class="welcome-card">
      <h1>Dota 2 Helper</h1>
      <p>Анализ пиков, контрпиков и персональные рекомендации</p>
      <div class="btn-group">
        <button class="btn-primary" onclick="openAuthModal()">Войти / Зарегистрироваться</button>
        <button class="btn-secondary" onclick="enterAsGuest()">Войти как гость</button>
      </div>
    </div>
  </div>

  <div id="main-app" class="hidden">
    <header>
      <div class="logo">Dota 2 Helper</div>
      <div class="user-panel">
        <button id="fav-btn" class="btn-fav hidden" onclick="openFavModal()">★ Любимые герои</button>
        <span id="user-display-name" class="user-badge">Гость</span>
        <button class="btn-logout" onclick="logout()">Выйти</button>
      </div>
    </header>

    <main>
      <div id="personal-ban-section" class="personal-ban-config hidden">
  <div style="text-align: center;">
    <h3 style="color: var(--text-main); font-size: 1rem; margin-bottom: 5px;">Ваш оптимальный бан-лист в Dota 2</h3>
    <p style="color: var(--text-muted); font-size: 0.8rem;">Основано на ваших любимых героях</p>
  </div>
  <div class="ban-slots-wrapper" id="global-ban-slots">
    <div class="ban-slot"></div>
    <div class="ban-slot"></div>
    <div class="ban-slot"></div>
    <div class="ban-slot"></div>
  </div>
</div>
      <div class="draft-container">
        <div class="team-box">
          <h3 class="allies-title">Моя команда</h3>
          <div class="inputs-grid">
            <div class="input-field-group">
              <label>Поз 1 — Керри</label>
              <div class="autocomplete-wrapper">
                <input type="text" id="my-pos1" placeholder="Выберите героя..." autocomplete="off">
                <button type="button" class="clear-input-btn" onclick="clearSingleInput('my-pos1')">&times;</button>
              </div>
            </div>
            <div class="input-field-group">
              <label>Поз 2 — Мид</label>
              <div class="autocomplete-wrapper">
                <input type="text" id="my-pos2" placeholder="Выберите героя..." autocomplete="off">
                <button type="button" class="clear-input-btn" onclick="clearSingleInput('my-pos2')">&times;</button>
              </div>
            </div>
            <div class="input-field-group">
              <label>Поз 3 — Тройка</label>
              <div class="autocomplete-wrapper">
                <input type="text" id="my-pos3" placeholder="Выберите героя..." autocomplete="off">
                <button type="button" class="clear-input-btn" onclick="clearSingleInput('my-pos3')">&times;</button>
              </div>
            </div>
            <div class="input-field-group">
              <label>Поз 4 — Четверка</label>
              <div class="autocomplete-wrapper">
                <input type="text" id="my-pos4" placeholder="Выберите героя..." autocomplete="off">
                <button type="button" class="clear-input-btn" onclick="clearSingleInput('my-pos4')">&times;</button>
              </div>
            </div>
            <div class="input-field-group">
              <label>Поз 5 — Пятерка</label>
              <div class="autocomplete-wrapper">
                <input type="text" id="my-pos5" placeholder="Выберите героя..." autocomplete="off">
                <button type="button" class="clear-input-btn" onclick="clearSingleInput('my-pos5')">&times;</button>
              </div>
            </div>
          </div>
        </div>

        <div class="team-box">
          <h3 class="enemies-title">Команда противника</h3>
          <div class="inputs-grid">
            <div class="input-field-group">
              <label>Враг 1</label>
              <div class="autocomplete-wrapper">
                <input type="text" id="enemy-1" placeholder="Выберите героя..." autocomplete="off">
                <button type="button" class="clear-input-btn" onclick="clearSingleInput('enemy-1')">&times;</button>
              </div>
            </div>
            <div class="input-field-group">
              <label>Враг 2</label>
              <div class="autocomplete-wrapper">
                <input type="text" id="enemy-2" placeholder="Выберите героя..." autocomplete="off">
                <button type="button" class="clear-input-btn" onclick="clearSingleInput('enemy-2')">&times;</button>
              </div>
            </div>
            <div class="input-field-group">
              <label>Враг 3</label>
              <div class="autocomplete-wrapper">
                <input type="text" id="enemy-3" placeholder="Выберите героя..." autocomplete="off">
                <button type="button" class="clear-input-btn" onclick="clearSingleInput('enemy-3')">&times;</button>
              </div>
            </div>
            <div class="input-field-group">
              <label>Враг 4</label>
              <div class="autocomplete-wrapper">
                <input type="text" id="enemy-4" placeholder="Выберите героя..." autocomplete="off">
                <button type="button" class="clear-input-btn" onclick="clearSingleInput('enemy-4')">&times;</button>
              </div>
            </div>
            <div class="input-field-group">
              <label>Враг 5</label>
              <div class="autocomplete-wrapper">
                <input type="text" id="enemy-5" placeholder="Выберите героя..." autocomplete="off">
                <button type="button" class="clear-input-btn" onclick="clearSingleInput('enemy-5')">&times;</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="actions-row">
        <button class="btn-analyze" onclick="analyzeDraft()">Проанализировать драфт</button>
        <button class="btn-clear" onclick="clearInputs()">Очистить</button>
      </div>

      <div id="results-container"></div>
    </main>
  </div>

  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active" onclick="switchAuthMode('login')">Вход</button>
        <button id="tab-register" class="auth-tab" onclick="switchAuthMode('register')">Регистрация</button>
      </div>
      <div id="auth-error" class="alert-error hidden"></div>
      <input type="text" id="auth-username" placeholder="Логин">
      <input type="password" id="auth-password" placeholder="Пароль">
      <button id="auth-submit-btn" class="btn-primary" onclick="submitAuth()">Войти</button>
      <button class="btn-secondary" onclick="closeAuthModal()">Отмена</button>
    </div>
  </div>

  <div id="fav-modal" class="modal-overlay hidden">
    <div class="modal-card modal-large">
      <h3>Выберите ваших любимых героев</h3>
      <input type="text" id="fav-search-input" placeholder="Поиск героя..." oninput="filterFavHeroes()">
      <div id="fav-heroes-container" class="fav-heroes-grid"></div>
      <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 16px;">
        <button class="btn-secondary" onclick="closeFavModal()">Отмена</button>
        <button class="btn-primary" onclick="saveFavorites()">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="/static/js/auth.js"></script>
  <script src="/static/js/favorites.js"></script>
  <script src="/static/js/draft.js"></script>
</body>
</html>
