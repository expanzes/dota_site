<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Helper</title><link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div id="welcome-screen">
        <div class="welcome-card">
            <h1>Dota 2 Helper</h1><p>Анализ и персональные рекомендации</p>
            <div class="btn-group">
                <button class="btn-primary" onclick="openAuthModal()">Войти</button>
                <button class="btn-secondary" onclick="enterAsGuest()">Гость</button>
            </div>
        </div>
    </div>
    <div id="main-app" class="hidden">
        <header>
            <div class="logo">Dota 2 Helper</div>
            <div class="user-panel">
                <button id="fav-btn" class="btn-fav hidden" onclick="openFavModal()">★ Любимые герои</button>
                <span id="user-display-name" class="user-badge">Гость</span>
                <button class="btn-logout" onclick="logout()">Выйти</button>
            </div>
        </header>
        <main>
            <div id="personal-ban-section" class="personal-ban-config hidden">
                <div style="text-align: center;">
                    <h3>Ваш оптимальный бан-лист</h3><p>На основе любимых героев</p>
                </div>
                <div class="ban-slots-wrapper" id="global-ban-slots"></div>
            </div>
            <div class="draft-container">
                <div class="team-box"><h3 class="allies-title">Моя команда</h3><div class="inputs-grid" id="allies-inputs"></div></div>
                <div class="team-box"><h3 class="enemies-title">Враги</h3><div class="inputs-grid" id="enemies-inputs"></div></div>
            </div>
            <div class="actions-row">
                <button class="btn-analyze" onclick="analyzeDraft()">Анализировать</button>
                <button class="btn-clear" onclick="clearInputs()">Очистить</button>
            </div>
            <div id="results-container"></div>
        </main>
    </div>
    <!-- Модалки -->
    <div id="auth-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="auth-tabs"><button id="tab-login" class="active" onclick="switchAuthMode('login')">Вход</button><button id="tab-register" onclick="switchAuthMode('register')">Регистрация</button></div>
            <div id="auth-error" class="alert-error hidden"></div>
            <input type="text" id="auth-username" placeholder="Логин"><input type="password" id="auth-password" placeholder="Пароль">
            <button class="btn-primary" onclick="submitAuth()">Ок</button><button onclick="closeAuthModal()">Отмена</button>
        </div>
    </div>
    <div id="fav-modal" class="modal-overlay hidden">
        <div class="modal-card modal-large">
            <h3>Выберите любимых героев</h3><input type="text" id="fav-search-input" placeholder="Поиск..." oninput="filterFavHeroes()">
            <div id="fav-heroes-container" class="fav-heroes-grid"></div>
            <button class="btn-primary" onclick="saveFavorites()">Сохранить</button><button onclick="closeFavModal()">Закрыть</button>
        </div>
    </div>
    <script src="/static/js/auth.js"></script><script src="/static/js/favorites.js"></script><script src="/static/js/draft.js"></script>
</body>
</html>
