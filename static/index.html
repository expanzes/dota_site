<!-- 1. Экран приветствия (Превью) -->
<div id="welcome-screen" class="screen">
  <div class="welcome-card">
    <h1>Dota 2 Helper</h1>
    <p>Выбери режим входа для доступа к аналитике драфтов</p>
    <div class="welcome-buttons">
      <button onclick="showAuthModal()" class="btn-primary">Войти / Зарегистрироваться</button>
      <button onclick="enterAsGuest()" class="btn-secondary">Продолжить без входа</button>
    </div>
  </div>
</div>

<!-- 2. Модальное окно авторизации -->
<div id="auth-modal" class="modal hidden">
  <div class="modal-content">
    <h2 id="auth-title">Вход в аккаунт</h2>
    <input type="text" id="username-input" placeholder="Логин">
    <input type="password" id="password-input" placeholder="Пароль">
    <button onclick="handleAuthSubmit()" class="btn-primary">Подтвердить</button>
    <button onclick="closeAuthModal()" class="btn-link">Назад</button>
  </div>
</div>

<!-- 3. Главный интерфейс приложения -->
<div id="main-app" class="screen hidden">
  <header class="app-header">
    <div id="user-info">Режим: Гость</div>
    <button id="auth-btn" onclick="logout()" class="btn-logout">Выйти</button>
  </header>
  
  <!-- Основной контент (Драфты, Герои и т.д.) -->
  <main>
    <h2>Анализ драфтов</h2>
    <!-- Твой существующий код драфтов и интерфейса -->
  </main>
</div>

<script>
  // Проверка состояния при загрузке страницы
  document.addEventListener('DOMContentLoaded', () => {
    const savedUser = localStorage.getItem('dota_user');
    if (savedUser) {
      const user = JSON.parse(savedUser);
      showMainApp(user.username);
    } else {
      showWelcomeScreen();
    }
  });

  function showWelcomeScreen() {
    document.getElementById('welcome-screen').classList.remove('hidden');
    document.getElementById('main-app').classList.add('hidden');
  }

  function enterAsGuest() {
    localStorage.removeItem('dota_user');
    showMainApp('Гость');
  }

  function showMainApp(username) {
    document.getElementById('welcome-screen').classList.add('hidden');
    document.getElementById('main-app').classList.remove('hidden');
    document.getElementById('user-info').innerText = `Пользователь: ${username}`;
  }

  function logout() {
    localStorage.removeItem('dota_user');
    showWelcomeScreen();
  }

  function showAuthModal() {
    document.getElementById('auth-modal').classList.remove('hidden');
  }

  function closeAuthModal() {
    document.getElementById('auth-modal').classList.add('hidden');
  }
</script>
