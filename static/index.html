<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Helper — Главная</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    
    <!-- ЭКРАН ПРИВЕТСТВИЯ -->
    <div id="welcome-screen">
        <div class="welcome-card">
            <h1>DOTA 2 HELPER</h1>
            <p>Профессиональная аналитика и инструменты</p>
            <button class="btn-primary" onclick="openAuthModal()">Войти / Регистрация</button>
            <button class="btn-secondary" onclick="enterAsGuest()">Войти как гость</button>
        </div>
    </div>

    <!-- ОСНОВНОЕ МЕНЮ -->
    <div id="main-app" class="hidden">
        <header>
            <div class="header-left">
                <div class="logo" onclick="window.location.href='/'">Dota 2 Helper</div>
                <nav class="main-nav">
                    <button class="nav-link" onclick="window.location.href='/drafts'">АНАЛИЗ ДРАФТОВ</button>
                    <button class="nav-link" onclick="window.location.href='/fantasy'">ФЕНТАЗИ ПОМОЩНИК</button>
                    <button class="nav-link" onclick="window.location.href='/invoker'">ТРЕНАЖЁР ИНВОКЕР</button>
                </nav>
            </div>
            <div class="user-panel">
                <span id="user-display-name" class="user-badge" onclick="window.location.href='/profile'">Гость</span>
                <button class="btn-logout" onclick="logout()">Выйти</button>
            </div>
        </header>
        <main style="text-align: center; padding-top: 100px;">
            <h1 style="font-size: 3rem; color: var(--accent-red); margin-bottom: 20px;">ГЛАВНОЕ МЕНЮ</h1>
            <p style="color: var(--text-muted); font-size: 1.2rem;">Выберите нужный инструмент в навигации.</p>
        </main>
    </div>

    <!-- МОДАЛКА ВХОДА -->
    <div id="auth-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="auth-tabs">
                <button id="tab-login" class="auth-tab active" onclick="switchAuthMode('login')">Вход</button>
                <button id="tab-register" class="auth-tab" onclick="switchAuthMode('register')">Регистрация</button>
            </div>
            <div id="auth-error" class="hidden" style="color:var(--accent-red); margin-bottom:10px; font-size:0.8rem;"></div>
            <input type="text" id="auth-username" placeholder="Логин">
            <input type="password" id="auth-password" placeholder="Пароль">
            <button class="btn-primary" onclick="submitAuth()">ПОДТВЕРДИТЬ</button>
            <button class="btn-steam" onclick="loginWithSteam()">
                <i class="fab fa-steam"></i> ВОЙТИ ЧЕРЕЗ STEAM
            </button>
            <button class="btn-secondary" onclick="closeAuthModal()">Отмена</button>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
