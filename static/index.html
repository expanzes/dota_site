<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Dota 2 AI Draft Helper</title>
  <style>
    body {
      background-color: #12161a;
      color: #e1e6eb;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #ff4655;
      margin-bottom: 25px;
    }
    .flex-grid {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .panel {
      flex: 1;
      background: #1a2228;
      border: 1px solid #2a353d;
      border-radius: 8px;
      padding: 15px;
    }
    .panel h2 {
      font-size: 16px;
      margin-top: 0;
      border-bottom: 2px solid #2a353d;
      padding-bottom: 8px;
    }
    .team-my h2 { color: #43b581; border-color: #43b581; }
    .team-enemy h2 { color: #f04747; border-color: #f04747; }
    .input-group {
      margin-bottom: 10px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      color: #8e9297;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #0f1316;
      border: 1px solid #2a353d;
      color: #fff;
      padding: 8px 10px;
      border-radius: 4px;
    }
    button.btn-analyze {
      width: 100%;
      background: #ff4655;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-analyze:hover {
      background: #e03e4c;
    }
    
    /* Стили результатов */
    .results-container {
      margin-top: 25px;
    }
    .role-section {
      background: #1a2228;
      border: 1px solid #2a353d;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .role-title {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 15px;
    }
    
    /* Карточка Главного пика */
    .best-card {
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, #242c33 0%, #171d22 100%);
      border: 2px solid #ffd700;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.2);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
      position: relative;
    }
    .badge-top {
      position: absolute;
      top: -10px;
      right: 15px;
      background: #ffd700;
      color: #000;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .best-card img {
      width: 110px;
      height: 62px;
      border-radius: 6px;
      object-fit: cover;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }
    .best-info {
      margin-left: 15px;
      flex-grow: 1;
    }
    .best-name {
      font-size: 20px;
      font-weight: bold;
      color: #fff;
    }
    .best-stats {
      margin-top: 5px;
      font-size: 14px;
      color: #a3a6aa;
    }
    .winrate-val {
      color: #43b581;
      font-weight: bold;
      font-size: 18px;
    }
    
    /* Сетка альтернатив */
    .alt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }
    .alt-card {
      display: flex;
      align-items: center;
      background: #12161a;
      border: 1px solid #2a353d;
      border-radius: 6px;
      padding: 8px;
    }
    .alt-card img {
      width: 55px;
      height: 31px;
      border-radius: 4px;
      object-fit: cover;
    }
    .alt-info {
      margin-left: 10px;
    }
    .alt-name {
      font-size: 13px;
      font-weight: bold;
      color: #e1e6eb;
    }
    .alt-wr {
      font-size: 12px;
      color: #43b581;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Dota 2 AI Draft Helper</h1>

  <div class="flex-grid">
    <!-- Моя команда -->
    <div class="panel team-my">
      <h2>Моя команда</h2>
      <div class="input-group"><label>Поз 1 — Керри</label><input id="pos1" value="Phantom Lancer / ПЛ"></div>
      <div class="input-group"><label>Поз 2 — Мид</label><input id="pos2" placeholder="Оставьте пустым для подбора..."></div>
      <div class="input-group"><label>Поз 3 — Тройка</label><input id="pos3" value="Axe / Акс"></div>
      <div class="input-group"><label>Поз 4 — Четверка</label><input id="pos4" value="Ancient Apparition / Аппарат"></div>
      <div class="input-group"><label>Поз 5 — Пятерка</label><input id="pos5" value="Bane / Бейн"></div>
    </div>

    <!-- Враги -->
    <div class="panel team-enemy">
      <h2>Команда противника</h2>
      <div class="input-group"><label>Враг 1</label><input class="enemy" value="Luna / Луна"></div>
      <div class="input-group"><label>Враг 2</label><input class="enemy" value="Ember Spirit / Эмбер"></div>
      <div class="input-group"><label>Враг 3</label><input class="enemy" value="Timbersaw / Тимбер"></div>
      <div class="input-group"><label>Враг 4</label><input class="enemy" value="Io / Висп"></div>
      <div class="input-group"><label>Враг 5</label><input class="enemy" value="Jakiro / Джакиро"></div>
    </div>
  </div>

  <button class="btn-analyze" onclick="analyze()">Проанализировать драфт</button>

  <div id="results" class="results-container"></div>
</div>

<script>
async function analyze() {
  const container = document.getElementById('results');
  container.innerHTML = '<div style="text-align:center; padding:20px;">Загрузка статистики OpenDota...</div>';

  const enemies = Array.from(document.querySelectorAll('.enemy')).map(i => i.value).filter(v => v.trim() !== '');
  
  const payload = {
    my_team: {
      pos1: document.getElementById('pos1').value,
      pos2: document.getElementById('pos2').value,
      pos3: document.getElementById('pos3').value,
      pos4: document.getElementById('pos4').value,
      pos5: document.getElementById('pos5').value
    },
    enemy_team: enemies
  };

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });

    const response = await res.json();
    container.innerHTML = '';

    if (response.status === 'error') {
      container.innerHTML = `<div style="color:#f04747;">${response.message}</div>`;
      return;
    }

    response.results.forEach(item => {
      const section = document.createElement('div');
      section.className = 'role-section';

      let html = `<div class="role-title">${item.role}</div>`;

      if (!item.data) {
        html += `<div style="color:#8e9297;">Не удалось подобрать подходящего героя.</div>`;
      } else {
        const best = item.data.best;
        // Главный герой
        html += `
          <div class="best-card">
            <span class="badge-top">★ ЛУЧШИЙ ПИК</span>
            <img src="${best.img}" alt="${best.name}">
            <div class="best-info">
              <div class="best-name">${best.name}</div>
              <div class="best-stats">
                Винрейт: <span class="winrate-val">${best.winrate}%</span> 
                <span style="font-size:12px; margin-left: 8px;">(матчей: ${best.games})</span>
              </div>
            </div>
          </div>
        `;

        // Альтернативы
        if (item.data.alternatives.length > 0) {
          html += `<div style="font-size:12px; color:#8e9297; margin-bottom:8px;">Другие сильные варианты:</div>`;
          html += `<div class="alt-grid">`;
          item.data.alternatives.forEach(alt => {
            html += `
              <div class="alt-card">
                <img src="${alt.img}" alt="${alt.name}">
                <div class="alt-info">
                  <div class="alt-name">${alt.name}</div>
                  <div class="alt-wr">${alt.winrate}% <span style="color:#8e9297; font-size:10px;">(${alt.games})</span></div>
                </div>
              </div>
            `;
          });
          html += `</div>`;
        }
      }

      section.innerHTML = html;
      container.appendChild(section);
    });

  } catch (err) {
    container.innerHTML = `<div style="color:#f04747;">Ошибка сервера или сети. Попробуйте снова.</div>`;
  }
}
</script>

</body>
</html>
