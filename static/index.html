<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota 2 Helper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d0e12;
      color: #e1e1e6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hidden {
      display: none !important;
    }

    /* --- Экран приветствия --- */
    #welcome-screen {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1a1d26 0%, #0d0e12 100%);
      padding: 20px;
    }

    .welcome-card {
      background: #16181f;
      border: 1px solid #272a37;
      border-radius: 12px;
      padding: 40px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .welcome-card h1 {
      color: #e11d48;
      font-size: 2.2rem;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .welcome-card p {
      color: #8b949e;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary {
      background: #e11d48;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #be123c;
    }

    .btn-secondary {
      background: #212430;
      color: #e1e1e6;
      border: 1px solid #33384a;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: #2b2f3e;
    }

    /* --- Модальные окна --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background: #16181f;
      border: 1px solid #272a37;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal-large {
      max-width: 700px;
      max-height: 85vh;
    }

    .modal-card input[type="text"], .modal-card input[type="password"] {
      background: #0d0e12;
      border: 1px solid #272a37;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      width: 100%;
    }

    .modal-card input:focus {
      outline: none;
      border-color: #e11d48;
    }

    .auth-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .auth-tab {
      flex: 1;
      padding: 8px;
      background: transparent;
      border: none;
      color: #8b949e;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-weight: 600;
    }

    .auth-tab.active {
      color: #e11d48;
      border-color: #e11d48;
    }

    .btn-close {
      background: transparent;
      border: none;
      color: #8b949e;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 5px;
    }

    /* --- Избранные герои --- */
    .fav-heroes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      max-height: 50vh;
      overflow-y: auto;
      padding-right: 5px;
      margin-top: 10px;
    }

    .fav-hero-chip {
      background: #0d0e12;
      border: 1px solid #272a37;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }

    .fav-hero-chip img {
      width: 32px;
      height: 18px;
      border-radius: 2px;
      object-fit: cover;
    }

    .fav-hero-chip span {
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fav-hero-chip.selected {
      border-color: #eab308;
      background: rgba(234, 179, 8, 0.15);
      color: #eab308;
    }

    /* --- Главный интерфейс --- */
    #main-app {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #16181f;
      border-bottom: 1px solid #272a37;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: bold;
      font-size: 1.3rem;
      color: #e11d48;
    }

    .user-panel {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-badge {
      background: #212430;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #8b949e;
    }

    .btn-fav {
      background: #212430;
      border: 1px solid #eab308;
      color: #eab308;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-fav:hover {
      background: #eab308;
      color: #0d0e12;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid #e11d48;
      color: #e11d48;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: #e11d48;
      color: #fff;
    }

    main {
      padding: 25px 30px;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
    }

    .alert-error {
      background: #3d1a1d;
      border: 1px solid #e11d48;
      color: #ff808b;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
    }

    /* --- Стили полей ввода --- */
    .draft-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      margin-bottom: 20px;
    }

    .team-box {
      background: #16181f;
      border: 1px solid #272a37;
      border-radius: 12px;
      padding: 20px;
    }

    .team-box h3 {
      font-size: 1.1rem;
      font-weight: 700;
      padding-bottom: 12px;
      margin-bottom: 15px;
      border-bottom: 1px solid #272a37;
    }

    .allies-title { color: #10b981; }
    .enemies-title { color: #f43f5e; }

    .inputs-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-field-group label {
      font-size: 0.8rem;
      color: #8b949e;
      font-weight: 500;
    }

    .input-field-group input {
      background: #0d0e12;
      border: 1px solid #272a37;
      color: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .input-field-group input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    /* Кнопки действия (Проанализировать + Очистить) */
    .actions-row {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }

    .btn-analyze {
      flex: 3;
      background: #e11d48;
      color: #fff;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-analyze:hover {
      background: #be123c;
    }

    .btn-clear {
      flex: 1;
      background: #212430;
      color: #a0a5b5;
      border: 1px solid #33384a;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-clear:hover {
      background: #2b2f3e;
      color: #fff;
    }

    /* --- Вывод результатов --- */
    .results-grid {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .role-section-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 15px;
    }

    .heroes-cards-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .card-hero {
      background: #16181f;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 290px;
      position: relative;
      border: 2px solid transparent;
    }

    .card-hero.pool-card { border-color: #a855f7; }
    .card-hero.winrate-card { border-color: #eab308; }
    .card-hero.games-card { border-color: #3b82f6; }
    .card-hero.standard-card { border-color: #272a37; }

    .badge-pill {
      position: absolute;
      top: -10px;
      right: 15px;
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 10px;
      letter-spacing: 0.5px;
    }

    .badge-pill.pool { background: #a855f7; color: #ffffff; }
    .badge-pill.winrate { background: #eab308; color: #000000; }
    .badge-pill.games { background: #3b82f6; color: #ffffff; }

    .hero-img-avatar {
      width: 55px;
      height: 32px;
      border-radius: 4px;
      object-fit: cover;
    }

    .hero-info-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hero-info-name {
      font-weight: 700;
      font-size: 1rem;
      color: #ffffff;
    }

    .hero-info-stat {
      font-size: 0.82rem;
      color: #8b949e;
    }

    .stat-green {
      color: #10b981;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .draft-container { grid-template-columns: 1fr; }
      .actions-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Автодополнение для списка героев -->
  <datalist id="heroes-list"></datalist>

  <!-- 1. Экран приветствия -->
  <div id="welcome-screen">
    <div class="welcome-card">
      <h1>Dota 2 Helper</h1>
      <p>Аналитика драфтов, персональные рекомендации и статистика матчей</p>
      <div class="btn-group">
        <button onclick="openAuthModal()" class="btn-primary">Войти / Зарегистрироваться</button>
        <button onclick="enterAsGuest()" class="btn-secondary">Продолжить без входа</button>
      </div>
    </div>
  </div>

  <!-- 2. Модальное окно авторизации -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active" onclick="switchAuthMode('login')">Вход</button>
        <button id="tab-register" class="auth-tab" onclick="switchAuthMode('register')">Регистрация</button>
      </div>

      <div id="auth-error" class="alert-error hidden"></div>

      <input type="text" id="auth-username" placeholder="Имя пользователя">
      <input type="password" id="auth-password" placeholder="Пароль">

      <button id="auth-submit-btn" onclick="submitAuth()" class="btn-primary">Войти</button>
      <button onclick="closeAuthModal()" class="btn-close">Отмена</button>
    </div>
  </div>

  <!-- 3. Модальное окно «Любимые герои» -->
  <div id="fav-modal" class="modal-overlay hidden">
    <div class="modal-card modal-large">
      <h2 style="color: #eab308; text-align: center;">Любимые герои</h2>
      <p style="color: #8b949e; font-size: 0.85rem; text-align: center;">Выберите персонажей, на которых вы играете чаще всего</p>
      
      <input type="text" id="fav-search-input" placeholder="Поиск героя..." oninput="filterFavHeroes()">
      
      <div id="fav-heroes-container" class="fav-heroes-grid"></div>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button onclick="saveFavorites()" class="btn-primary" style="flex: 1; background: #eab308; color: #0d0e12;">Сохранить</button>
        <button onclick="closeFavModal()" class="btn-secondary" style="flex: 1;">Отмена</button>
      </div>
    </div>
  </div>

  <!-- 4. Главный интерфейс приложения -->
  <div id="main-app" class="hidden">
    <header>
      <div class="logo">Dota 2 Helper</div>
      <div class="user-panel">
        <button id="fav-btn" onclick="openFavModal()" class="btn-fav">⭐ Любимые герои</button>
        <span id="user-display-name" class="user-badge">Гость</span>
        <button onclick="logout()" class="btn-logout">Выйти</button>
      </div>
    </header>

    <main>
      <div class="draft-container">
        <!-- Наша команда -->
        <div class="team-box">
          <h3 class="allies-title">Моя команда</h3>
          <div class="inputs-grid">
            <div class="input-field-group">
              <label>Поз 1 — Керри</label>
              <input type="text" id="my-pos1" list="heroes-list" placeholder="Выберите героя...">
            </div>
            <div class="input-field-group">
              <label>Поз 2 — Мид</label>
              <input type="text" id="my-pos2" list="heroes-list" placeholder="Выберите героя...">
            </div>
            <div class="input-field-group">
              <label>Поз 3 — Тройка</label>
              <input type="text" id="my-pos3" list="heroes-list" placeholder="Выберите героя...">
            </div>
            <div class="input-field-group">
              <label>Поз 4 — Четверка</label>
              <input type="text" id="my-pos4" list="heroes-list" placeholder="Выберите героя...">
            </div>
            <div class="input-field-group">
              <label>Поз 5 — Пятерка</label>
              <input type="text" id="my-pos5" list="heroes-list" placeholder="Выберите героя...">
            </div>
          </div>
        </div>

        <!-- Команда противника -->
        <div class="team-box">
          <h3 class="enemies-title">Команда противника</h3>
          <div class="inputs-grid">
            <div class="input-field-group">
              <label>Враг 1</label>
              <input type="text" id="enemy-1" list="heroes-list" placeholder="Выберите героя...">
            </div>
            <div class="input-field-group">
              <label>Враг 2</label>
              <input type="text" id="enemy-2" list="heroes-list" placeholder="Выберите героя...">
            </div>
            <div class="input-field-group">
              <label>Враг 3</label>
              <input type="text" id="enemy-3" list="heroes-list" placeholder="Выберите героя...">
            </div>
            <div class="input-field-group">
              <label>Враг 4</label>
              <input type="text" id="enemy-4" list="heroes-list" placeholder="Выберите героя...">
            </div>
            <div class="input-field-group">
              <label>Враг 5</label>
              <input type="text" id="enemy-5" list="heroes-list" placeholder="Выберите героя...">
            </div>
          </div>
        </div>
      </div>

      <!-- Кнопки расчета и очистки -->
      <div class="actions-row">
        <button onclick="analyzeDraft()" class="btn-analyze">Проанализировать драфт</button>
        <button onclick="clearInputs()" class="btn-clear">Очистить</button>
      </div>

      <!-- Контейнер вывода результатов -->
      <div id="results-container" class="results-grid"></div>
    </main>
  </div>

  <script>
    let authMode = 'login';
    let currentUser = null;
    let allHeroes = [];
    let selectedFavorites = new Set();

    document.addEventListener('DOMContentLoaded', async () => {
      await loadHeroes();

      const savedUser = localStorage.getItem('dota_helper_user');
      if (savedUser) {
        try {
          currentUser = JSON.parse(savedUser);
          await loadUserFavorites();
          showMainApp();
        } catch (e) {
          showWelcomeScreen();
        }
      } else {
        showWelcomeScreen();
      }
    });

    async function loadHeroes() {
      try {
        const res = await fetch('/api/heroes');
        if (res.ok) {
          allHeroes = await res.json();
          populateDatalist();
        }
      } catch (err) {
        console.error("Ошибка загрузки героев:", err);
      }
    }

    function populateDatalist() {
      const datalist = document.getElementById('heroes-list');
      datalist.innerHTML = '';
      allHeroes.forEach(hero => {
        const option = document.createElement('option');
        option.value = hero.name;
        datalist.appendChild(option);
      });
    }

    async function loadUserFavorites() {
      if (!currentUser || !currentUser.user_id) return;
      try {
        const res = await fetch(`/api/favorites/${currentUser.user_id}`);
        if (res.ok) {
          const favs = await res.json();
          selectedFavorites = new Set(favs);
        }
      } catch (err) {
        console.error("Ошибка загрузки избранного:", err);
      }
    }

    function showWelcomeScreen() {
      document.getElementById('welcome-screen').classList.remove('hidden');
      document.getElementById('main-app').classList.add('hidden');
      closeAuthModal();
    }

    function showMainApp() {
      document.getElementById('welcome-screen').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');

      const nameLabel = document.getElementById('user-display-name');
      const favBtn = document.getElementById('fav-btn');

      if (currentUser && currentUser.username) {
        nameLabel.innerText = currentUser.username;
        favBtn.classList.remove('hidden');
      } else {
        nameLabel.innerText = 'Режим: Гость';
        favBtn.classList.add('hidden');
      }
    }

    function enterAsGuest() {
      currentUser = null;
      selectedFavorites.clear();
      localStorage.removeItem('dota_helper_user');
      showMainApp();
    }

    function logout() {
      currentUser = null;
      selectedFavorites.clear();
      localStorage.removeItem('dota_helper_user');
      showWelcomeScreen();
    }

    function openAuthModal() {
      document.getElementById('auth-modal').classList.remove('hidden');
      document.getElementById('auth-error').classList.add('hidden');
      document.getElementById('auth-username').value = '';
      document.getElementById('auth-password').value = '';
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
    }

    function switchAuthMode(mode) {
      authMode = mode;
      document.getElementById('auth-error').classList.add('hidden');
      
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const submitBtn = document.getElementById('auth-submit-btn');

      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        submitBtn.innerText = 'Войти';
      } else {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        submitBtn.innerText = 'Зарегистрироваться';
      }
    }

    async function submitAuth() {
      const usernameInput = document.getElementById('auth-username').value.trim();
      const passwordInput = document.getElementById('auth-password').value.trim();
      const errorBox = document.getElementById('auth-error');

      if (!usernameInput || !passwordInput) {
        errorBox.innerText = 'Заполните все поля';
        errorBox.classList.remove('hidden');
        return;
      }

      const endpoint = authMode === 'login' ? '/api/login' : '/api/register';

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usernameInput, password: passwordInput })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || 'Ошибка авторизации');
        }

        currentUser = {
          user_id: data.user_id,
          username: data.username
        };

        localStorage.setItem('dota_helper_user', JSON.stringify(currentUser));
        await loadUserFavorites();
        closeAuthModal();
        showMainApp();

      } catch (err) {
        errorBox.innerText = err.message;
        errorBox.classList.remove('hidden');
      }
    }

    /* --- Избранные герои --- */
    function openFavModal() {
      document.getElementById('fav-modal').classList.remove('hidden');
      document.getElementById('fav-search-input').value = '';
      renderFavHeroes();
    }

    function closeFavModal() {
      document.getElementById('fav-modal').classList.add('hidden');
    }

    function renderFavHeroes() {
      const container = document.getElementById('fav-heroes-container');
      const searchQuery = document.getElementById('fav-search-input').value.toLowerCase().trim();
      container.innerHTML = '';

      allHeroes.forEach(hero => {
        if (searchQuery && !hero.name.toLowerCase().includes(searchQuery)) return;

        const isSelected = selectedFavorites.has(hero.name);
        const chip = document.createElement('div');
        chip.className = `fav-hero-chip ${isSelected ? 'selected' : ''}`;
        chip.innerHTML = `<img src="${hero.img}" alt="${hero.name}"><span>${hero.name}</span>`;
        chip.onclick = () => {
          if (selectedFavorites.has(hero.name)) {
            selectedFavorites.delete(hero.name);
          } else {
            selectedFavorites.add(hero.name);
          }
          renderFavHeroes();
        };
        container.appendChild(chip);
      });
    }

    function filterFavHeroes() {
      renderFavHeroes();
    }

    async function saveFavorites() {
      if (!currentUser || !currentUser.user_id) return;
      try {
        await fetch('/api/favorites', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: currentUser.user_id,
            heroes: Array.from(selectedFavorites)
          })
        });
        closeFavModal();
      } catch (err) {
        alert("Ошибка при сохранении избранного");
      }
    }

    function clearInputs() {
      document.getElementById('my-pos1').value = '';
      document.getElementById('my-pos2').value = '';
      document.getElementById('my-pos3').value = '';
      document.getElementById('my-pos4').value = '';
      document.getElementById('my-pos5').value = '';

      document.getElementById('enemy-1').value = '';
      document.getElementById('enemy-2').value = '';
      document.getElementById('enemy-3').value = '';
      document.getElementById('enemy-4').value = '';
      document.getElementById('enemy-5').value = '';

      document.getElementById('results-container').innerHTML = '';
    }

    /* --- Анализ Драфта --- */
    async function analyzeDraft() {
      const myTeam = {
        pos1: document.getElementById('my-pos1').value.trim(),
        pos2: document.getElementById('my-pos2').value.trim(),
        pos3: document.getElementById('my-pos3').value.trim(),
        pos4: document.getElementById('my-pos4').value.trim(),
        pos5: document.getElementById('my-pos5').value.trim()
      };

      const enemyTeam = [
        document.getElementById('enemy-1').value.trim(),
        document.getElementById('enemy-2').value.trim(),
        document.getElementById('enemy-3').value.trim(),
        document.getElementById('enemy-4').value.trim(),
        document.getElementById('enemy-5').value.trim()
      ].filter(h => h !== '');

      const payload = {
        my_team: myTeam,
        enemy_team: enemyTeam,
        user_id: currentUser ? currentUser.user_id : null
      };

      const container = document.getElementById('results-container');
      container.innerHTML = '<p style="text-align: center; color: #8b949e;">Загрузка и расчет контрпиков...</p>';

      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        container.innerHTML = '';

        if (!data.results || data.results.length === 0) {
          container.innerHTML = '<p style="text-align: center; color: #8b949e;">Все роли у вас уже укомплектованы или нет данных.</p>';
          return;
        }

        data.results.forEach(r => {
          if (!r.data) return;

          const section = document.createElement('div');
          
          let html = `<div class="role-section-title">${r.role}</div><div class="heroes-cards-flex">`;

          if (r.data.top_favorite) {
            html += renderHeroCard(r.data.top_favorite, '⭐ ИЗ ВАШЕГО ПУЛА', 'pool-card', 'pool', true);
          }
          if (r.data.top_winrate) {
            html += renderHeroCard(r.data.top_winrate, '★ МАКС. ВИНРЕЙТ', 'winrate-card', 'winrate', true);
          }
          if (r.data.top_games) {
            html += renderHeroCard(r.data.top_games, '📊 МАКС. МАТЧЕЙ', 'games-card', 'games', false);
          }

          // Дополнительные 3 героя по винрейту
          if (r.data.others && r.data.others.length > 0) {
            const extraHeroes = r.data.others.slice(0, 3);
            extraHeroes.forEach(h => {
              html += renderHeroCard(h, null, 'standard-card', '', true);
            });
          }

          html += '</div>';
          section.innerHTML = html;
          container.appendChild(section);
        });

      } catch (err) {
        container.innerHTML = `<p style="text-align: center; color: #ff808b;">Ошибка при анализе: ${err.message}</p>`;
      }
    }

    function renderHeroCard(hero, badgeText, cardClass, badgeClass, showWinrateFirst) {
      const statsText = showWinrateFirst
        ? `Винрейт: <span class="stat-green">${hero.winrate}%</span> (${hero.games} игр)`
        : `Матчей: ${hero.games} (<span class="stat-green">${hero.winrate}% WR</span>)`;

      return `
        <div class="card-hero ${cardClass}">
          ${badgeText ? `<span class="badge-pill ${badgeClass}">${badgeText}</span>` : ''}
          <img class="hero-img-avatar" src="${hero.img}" alt="${hero.name}" />
          <div class="hero-info-text">
            <span class="hero-info-name">${hero.name}</span>
            <span class="hero-info-stat">${statsText}</span>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
