<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota 2 Helper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121214;
      color: #e1e1e6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hidden {
      display: none !important;
    }

    /* --- Экран приветствия (Превью) --- */
    #welcome-screen {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1f232d 0%, #0d0e12 100%);
      padding: 20px;
    }

    .welcome-card {
      background: #181a20;
      border: 1px solid #2a2e3d;
      border-radius: 12px;
      padding: 40px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .welcome-card h1 {
      color: #ff4655;
      font-size: 2.2rem;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .welcome-card p {
      color: #a0a5b5;
      margin-bottom: 30px;
      font-size: 1rem;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary {
      background: #ff4655;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #e03e4c;
    }

    .btn-secondary {
      background: #252836;
      color: #e1e1e6;
      border: 1px solid #3b3f54;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: #2f3446;
    }

    /* --- Модальные окна --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background: #181a20;
      border: 1px solid #2a2e3d;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal-large {
      max-width: 700px;
      max-height: 85vh;
    }

    .modal-card input[type="text"], .modal-card input[type="password"] {
      background: #121214;
      border: 1px solid #2a2e3d;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      width: 100%;
    }

    .modal-card input:focus {
      outline: none;
      border-color: #ff4655;
    }

    .auth-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .auth-tab {
      flex: 1;
      padding: 8px;
      background: transparent;
      border: none;
      color: #a0a5b5;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-weight: 600;
    }

    .auth-tab.active {
      color: #ff4655;
      border-color: #ff4655;
    }

    .btn-close {
      background: transparent;
      border: none;
      color: #a0a5b5;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 5px;
    }

    /* --- Выбор избранных героев --- */
    .fav-heroes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      max-height: 50vh;
      overflow-y: auto;
      padding-right: 5px;
      margin-top: 10px;
    }

    .fav-hero-chip {
      background: #121214;
      border: 1px solid #2a2e3d;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }

    .fav-hero-chip img {
      width: 32px;
      height: 18px;
      border-radius: 2px;
      object-fit: cover;
    }

    .fav-hero-chip span {
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fav-hero-chip.selected {
      border-color: #f5a623;
      background: rgba(245, 166, 35, 0.15);
      color: #f5a623;
    }

    /* --- Главный интерфейс --- */
    #main-app {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #181a20;
      border-bottom: 1px solid #2a2e3d;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: bold;
      font-size: 1.4rem;
      color: #ff4655;
    }

    .user-panel {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-badge {
      background: #252836;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      color: #a0a5b5;
    }

    .btn-fav {
      background: #252836;
      border: 1px solid #f5a623;
      color: #f5a623;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-fav:hover {
      background: #f5a623;
      color: #121214;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid #ff4655;
      color: #ff4655;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: #ff4655;
      color: #fff;
    }

    main {
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .alert-error {
      background: #3d1a1d;
      border: 1px solid #ff4655;
      color: #ff808b;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
    }

    /* --- Стили Драфта --- */
    .draft-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    .team-box {
      background: #181a20;
      border: 1px solid #2a2e3d;
      border-radius: 10px;
      padding: 20px;
    }

    .team-box h3 {
      margin-bottom: 15px;
      font-size: 1.1rem;
    }

    .allies-title { color: #42a5f5; }
    .enemies-title { color: #ff4655; }

    .inputs-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-row label {
      width: 120px;
      font-size: 0.85rem;
      color: #a0a5b5;
    }

    .input-row input {
      flex: 1;
      background: #121214;
      border: 1px solid #2a2e3d;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
    }

    .input-row input:focus {
      outline: none;
      border-color: #ff4655;
    }

    .analyze-btn-wrapper {
      text-align: center;
      margin-bottom: 30px;
    }

    .btn-analyze {
      background: #ff4655;
      color: #fff;
      border: none;
      padding: 14px 40px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-analyze:hover {
      background: #e03e4c;
    }

    /* --- Карточки результатов --- */
    .results-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .role-card {
      background: #181a20;
      border: 1px solid #2a2e3d;
      border-radius: 10px;
      padding: 20px;
    }

    .role-title {
      font-size: 1.2rem;
      color: #ff4655;
      margin-bottom: 15px;
      border-bottom: 1px solid #2a2e3d;
      padding-bottom: 8px;
    }

    .heroes-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .hero-item {
      background: #212430;
      border: 1px solid #33384a;
      border-radius: 8px;
      padding: 10px;
      width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .hero-item img {
      width: 100%;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .hero-name {
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .hero-stat {
      font-size: 0.85rem;
      color: #a0a5b5;
    }

    .badge {
      position: absolute;
      top: -8px;
      right: -8px;
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
    }

    .badge-fav { background: #f5a623; color: #000; }
    .badge-wr { background: #4caf50; }
    .badge-gm { background: #2196f3; }

    @media (max-width: 768px) {
      .draft-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Автодополнение для списка героев -->
  <datalist id="heroes-list"></datalist>

  <!-- 1. Экран приветствия (Превью) -->
  <div id="welcome-screen">
    <div class="welcome-card">
      <h1>Dota 2 Helper</h1>
      <p>Аналитика драфтов, персональные рекомендации и статистика матчей</p>
      <div class="btn-group">
        <button onclick="openAuthModal()" class="btn-primary">Войти / Зарегистрироваться</button>
        <button onclick="enterAsGuest()" class="btn-secondary">Продолжить без входа</button>
      </div>
    </div>
  </div>

  <!-- 2. Модальное окно авторизации -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active" onclick="switchAuthMode('login')">Вход</button>
        <button id="tab-register" class="auth-tab" onclick="switchAuthMode('register')">Регистрация</button>
      </div>

      <div id="auth-error" class="alert-error hidden"></div>

      <input type="text" id="auth-username" placeholder="Имя пользователя">
      <input type="password" id="auth-password" placeholder="Пароль">

      <button id="auth-submit-btn" onclick="submitAuth()" class="btn-primary">Войти</button>
      <button onclick="closeAuthModal()" class="btn-close">Отмена</button>
    </div>
  </div>

  <!-- 3. Модальное окно «Любимые герои» -->
  <div id="fav-modal" class="modal-overlay hidden">
    <div class="modal-card modal-large">
      <h2 style="color: #f5a623; text-align: center;">Любимые герои</h2>
      <p style="color: #a0a5b5; font-size: 0.85rem; text-align: center;">Выберите персонажей, на которых вы играете чаще всего</p>
      
      <input type="text" id="fav-search-input" placeholder="Поиск героя..." oninput="filterFavHeroes()">
      
      <div id="fav-heroes-container" class="fav-heroes-grid"></div>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button onclick="saveFavorites()" class="btn-primary" style="flex: 1; background: #f5a623; color: #121214;">Сохранить</button>
        <button onclick="closeFavModal()" class="btn-secondary" style="flex: 1;">Отмена</button>
      </div>
    </div>
  </div>

  <!-- 4. Главный интерфейс приложения -->
  <div id="main-app" class="hidden">
    <header>
      <div class="logo">Dota 2 Helper</div>
      <div class="user-panel">
        <button id="fav-btn" onclick="openFavModal()" class="btn-fav">⭐ Любимые герои</button>
        <span id="user-display-name" class="user-badge">Гость</span>
        <button onclick="logout()" class="btn-logout">Выйти</button>
      </div>
    </header>

    <main>
      <div class="draft-container">
        <!-- Наша команда -->
        <div class="team-box">
          <h3 class="allies-title">Союзники (Наша команда)</h3>
          <div class="inputs-grid">
            <div class="input-row"><label>Поз 1 (Керри):</label><input type="text" id="my-pos1" list="heroes-list" placeholder="Например: Sven"></div>
            <div class="input-row"><label>Поз 2 (Мид):</label><input type="text" id="my-pos2" list="heroes-list" placeholder="Например: SF"></div>
            <div class="input-row"><label>Поз 3 (Тройка):</label><input type="text" id="my-pos3" list="heroes-list" placeholder="Например: Axe"></div>
            <div class="input-row"><label>Поз 4 (Четверка):</label><input type="text" id="my-pos4" list="heroes-list" placeholder="Например: Rubick"></div>
            <div class="input-row"><label>Поз 5 (Пятерка):</label><input type="text" id="my-pos5" list="heroes-list" placeholder="Например: CM"></div>
          </div>
        </div>

        <!-- Команда врага -->
        <div class="team-box">
          <h3 class="enemies-title">Враги (Пики противника)</h3>
          <div class="inputs-grid">
            <div class="input-row"><label>Враг 1:</label><input type="text" id="enemy-1" list="heroes-list" placeholder="Герой врага 1"></div>
            <div class="input-row"><label>Враг 2:</label><input type="text" id="enemy-2" list="heroes-list" placeholder="Герой врага 2"></div>
            <div class="input-row"><label>Враг 3:</label><input type="text" id="enemy-3" list="heroes-list" placeholder="Герой врага 3"></div>
            <div class="input-row"><label>Враг 4:</label><input type="text" id="enemy-4" list="heroes-list" placeholder="Герой врага 4"></div>
            <div class="input-row"><label>Враг 5:</label><input type="text" id="enemy-5" list="heroes-list" placeholder="Герой врага 5"></div>
          </div>
        </div>
      </div>

      <div class="analyze-btn-wrapper">
        <button onclick="analyzeDraft()" class="btn-analyze">Рассчитать наилучшие пики</button>
      </div>

      <!-- Вывод результатов -->
      <div id="results-container" class="results-grid"></div>
    </main>
  </div>

  <script>
    let authMode = 'login';
    let currentUser = null;
    let allHeroes = [];
    let selectedFavorites = new Set();

    document.addEventListener('DOMContentLoaded', async () => {
      await loadHeroes();

      const savedUser = localStorage.getItem('dota_helper_user');
      if (savedUser) {
        try {
          currentUser = JSON.parse(savedUser);
          await loadUserFavorites();
          showMainApp();
        } catch (e) {
          showWelcomeScreen();
        }
      } else {
        showWelcomeScreen();
      }
    });

    async function loadHeroes() {
      try {
        const res = await fetch('/api/heroes');
        if (res.ok) {
          allHeroes = await res.json();
          populateDatalist();
        }
      } catch (err) {
        console.error("Ошибка загрузки героев:", err);
      }
    }

    function populateDatalist() {
      const datalist = document.getElementById('heroes-list');
      datalist.innerHTML = '';
      allHeroes.forEach(hero => {
        const option = document.createElement('option');
        option.value = hero.name;
        datalist.appendChild(option);
      });
    }

    async function loadUserFavorites() {
      if (!currentUser || !currentUser.user_id) return;
      try {
        const res = await fetch(`/api/favorites/${currentUser.user_id}`);
        if (res.ok) {
          const favs = await res.json();
          selectedFavorites = new Set(favs);
        }
      } catch (err) {
        console.error("Ошибка загрузки избранного:", err);
      }
    }

    function showWelcomeScreen() {
      document.getElementById('welcome-screen').classList.remove('hidden');
      document.getElementById('main-app').classList.add('hidden');
      closeAuthModal();
    }

    function showMainApp() {
      document.getElementById('welcome-screen').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');

      const nameLabel = document.getElementById('user-display-name');
      const favBtn = document.getElementById('fav-btn');

      if (currentUser && currentUser.username) {
        nameLabel.innerText = currentUser.username;
        favBtn.classList.remove('hidden');
      } else {
        nameLabel.innerText = 'Режим: Гость';
        favBtn.classList.add('hidden');
      }
    }

    function enterAsGuest() {
      currentUser = null;
      selectedFavorites.clear();
      localStorage.removeItem('dota_helper_user');
      showMainApp();
    }

    function logout() {
      currentUser = null;
      selectedFavorites.clear();
      localStorage.removeItem('dota_helper_user');
      showWelcomeScreen();
    }

    function openAuthModal() {
      document.getElementById('auth-modal').classList.remove('hidden');
      document.getElementById('auth-error').classList.add('hidden');
      document.getElementById('auth-username').value = '';
      document.getElementById('auth-password').value = '';
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
    }

    function switchAuthMode(mode) {
      authMode = mode;
      document.getElementById('auth-error').classList.add('hidden');
      
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const submitBtn = document.getElementById('auth-submit-btn');

      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        submitBtn.innerText = 'Войти';
      } else {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        submitBtn.innerText = 'Зарегистрироваться';
      }
    }

    async function submitAuth() {
      const usernameInput = document.getElementById('auth-username').value.trim();
      const passwordInput = document.getElementById('auth-password').value.trim();
      const errorBox = document.getElementById('auth-error');

      if (!usernameInput || !passwordInput) {
        errorBox.innerText = 'Заполните все поля';
        errorBox.classList.remove('hidden');
        return;
      }

      const endpoint = authMode === 'login' ? '/api/login' : '/api/register';

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usernameInput, password: passwordInput })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || 'Ошибка авторизации');
        }

        currentUser = {
          user_id: data.user_id,
          username: data.username
        };

        localStorage.setItem('dota_helper_user', JSON.stringify(currentUser));
        await loadUserFavorites();
        closeAuthModal();
        showMainApp();

      } catch (err) {
        errorBox.innerText = err.message;
        errorBox.classList.remove('hidden');
      }
    }

    /* --- Избранные герои --- */
    function openFavModal() {
      document.getElementById('fav-modal').classList.remove('hidden');
      document.getElementById('fav-search-input').value = '';
      renderFavHeroes();
    }

    function closeFavModal() {
      document.getElementById('fav-modal').classList.add('hidden');
    }

    function renderFavHeroes() {
      const container = document.getElementById('fav-heroes-container');
      const searchQuery = document.getElementById('fav-search-input').value.toLowerCase().trim();
      container.innerHTML = '';

      allHeroes.forEach(hero => {
        if (searchQuery && !hero.name.toLowerCase().includes(searchQuery)) return;

        const isSelected = selectedFavorites.has(hero.name);
        const chip = document.createElement('div');
        chip.className = `fav-hero-chip ${isSelected ? 'selected' : ''}`;
        chip.innerHTML = `<img src="${hero.img}" alt="${hero.name}"><span>${hero.name}</span>`;
        chip.onclick = () => {
          if (selectedFavorites.has(hero.name)) {
            selectedFavorites.delete(hero.name);
          } else {
            selectedFavorites.add(hero.name);
          }
          renderFavHeroes();
        };
        container.appendChild(chip);
      });
    }

    function filterFavHeroes() {
      renderFavHeroes();
    }

    async function saveFavorites() {
      if (!currentUser || !currentUser.user_id) return;
      try {
        await fetch('/api/favorites', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: currentUser.user_id,
            heroes: Array.from(selectedFavorites)
          })
        });
        closeFavModal();
      } catch (err) {
        alert("Ошибка при сохранении избранного");
      }
    }

    /* --- Анализ Драфта --- */
    async function analyzeDraft() {
      const myTeam = {
        pos1: document.getElementById('my-pos1').value.trim(),
        pos2: document.getElementById('my-pos2').value.trim(),
        pos3: document.getElementById('my-pos3').value.trim(),
        pos4: document.getElementById('my-pos4').value.trim(),
        pos5: document.getElementById('my-pos5').value.trim()
      };

      const enemyTeam = [
        document.getElementById('enemy-1').value.trim(),
        document.getElementById('enemy-2').value.trim(),
        document.getElementById('enemy-3').value.trim(),
        document.getElementById('enemy-4').value.trim(),
        document.getElementById('enemy-5').value.trim()
      ].filter(h => h !== '');

      const payload = {
        my_team: myTeam,
        enemy_team: enemyTeam,
        user_id: currentUser ? currentUser.user_id : null
      };

      const container = document.getElementById('results-container');
      container.innerHTML = '<p style="text-align: center; color: #a0a5b5;">Загрузка и расчет контрпиков...</p>';

      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        container.innerHTML = '';

        if (!data.results || data.results.length === 0) {
          container.innerHTML = '<p style="text-align: center; color: #a0a5b5;">Все роли у вас уже укомплектованы или нет данных.</p>';
          return;
        }

        data.results.forEach(r => {
          if (!r.data) return;

          const card = document.createElement('div');
          card.className = 'role-card';

          let html = `<div class="role-title">${r.role}</div><div class="heroes-flex">`;

          if (r.data.top_favorite) {
            html += renderHeroCard(r.data.top_favorite, 'Избранный', 'badge-fav');
          }
          if (r.data.top_winrate) {
            html += renderHeroCard(r.data.top_winrate, 'Топ Винрейт', 'badge-wr');
          }
          if (r.data.top_games) {
            html += renderHeroCard(r.data.top_games, 'Много матчей', 'badge-gm');
          }
          if (r.data.others) {
            r.data.others.forEach(h => {
              html += renderHeroCard(h, null, null);
            });
          }

          html += '</div>';
          card.innerHTML = html;
          container.appendChild(card);
        });

      } catch (err) {
        container.innerHTML = `<p style="text-align: center; color: #ff808b;">Ошибка при анализе: ${err.message}</p>`;
      }
    }

    function renderHeroCard(hero, badgeText, badgeClass) {
      return `
        <div class="hero-item">
          ${badgeText ? `<span class="badge ${badgeClass}">${badgeText}</span>` : ''}
          <img src="${hero.img}" alt="${hero.name}" />
          <div class="hero-name">${hero.name}</div>
          <div class="hero-stat">Винрейт: <b>${hero.winrate}%</b></div>
          <div class="hero-stat">Матчей: ${hero.games}</div>
        </div>
      `;
    }
  </script>
</body>
</html>
