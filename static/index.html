<!DOCTYPE html>

    <title>Dota 2 AI Draft Helper</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121418; color: #e1e1e1; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #1b1e24; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #e54e38; margin-top: 0; margin-bottom: 20px; }
        .teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 650px) { .teams-grid { grid-template-columns: 1fr; } }
        .team-card { background: #232730; padding: 15px; border-radius: 8px; border: 1px solid #323846; }
        .team-title { font-weight: bold; font-size: 1.1em; margin-bottom: 15px; padding-bottom: 5px; border-bottom: 2px solid; }
        .my-team .team-title { color: #4CAF50; border-color: #4CAF50; }
        .enemy-team .team-title { color: #F44336; border-color: #F44336; }
        .slot-group { margin-bottom: 10px; }
        .slot-group label { display: block; font-size: 0.85em; color: #aaa; margin-bottom: 4px; }
        input[type="text"] { width: 100%; padding: 8px 12px; background: #121418; border: 1px solid #3a4150; border-radius: 6px; color: #fff; font-size: 0.95em; outline: none; }
        input[type="text"]:focus { border-color: #e54e38; }
        .actions { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; font-size: 1em; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-submit { background: #e54e38; color: white; }
        .btn-submit:hover { background: #ff5c45; }
        .btn-clear { background: #3a4150; color: #ccc; flex: 0.3; }
        .btn-clear:hover { background: #4a5366; color: white; }
        #result-box { margin-top: 20px; padding: 15px; background: #121418; border-left: 4px solid #e54e38; border-radius: 4px; white-space: pre-wrap; display: none; }
    </style>
</head>

            <div class="team-title">🛡️ Моя команда</div>

                <label>Поз 1 — Керри</label>
                <input type="text" id="my_pos1" list="dota-heroes" placeholder="Выберите героя...">
            </div>

    <div class="actions">
        <button class="btn-submit" onclick="analyzeDraft()">Проанализировать драфт</button>
        <button class="btn-clear" onclick="clearFields()">Очистить</button>
    </div>

    <div id="result-box"></div>
</div>

<script>
    async function analyzeDraft() {
        const resultBox = document.getElementById('result-box');
        resultBox.style.display = 'block';
        resultBox.innerText = 'Анализирую драфт... Пожалуйста, подождите.';

        const payload = {
            my_team: {
                pos1: document.getElementById('my_pos1').value,
                pos2: document.getElementById('my_pos2').value,
                pos3: document.getElementById('my_pos3').value,
                pos4: document.getElementById('my_pos4').value,
                pos5: document.getElementById('my_pos5').value
            },
            enemy_team: [
                document.getElementById('enemy_1').value,
                document.getElementById('enemy_2').value,
                document.getElementById('enemy_3').value,
                document.getElementById('enemy_4').value,
                document.getElementById('enemy_5').value
            ]
        };

        try {
            const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            resultBox.innerText = data.analysis || data.error;
        } catch (e) {
            resultBox.innerText = 'Ошибка при соединении с сервером.';
        }
    }

    function clearFields() {
        const inputs = document.querySelectorAll('input[type="text"]');
        inputs.forEach(input => input.value = '');
        document.getElementById('result-box').style.display = 'none';
    }
</script>
