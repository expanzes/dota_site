<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Helper</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="welcome-screen">
        <div class="welcome-card">
            <h1>DOTA 2 HELPER</h1>
            <p style="color:var(--text-muted)">Профессиональная аналитика</p>
            <div class="btn-group">
                <button class="btn-main" onclick="openAuthModal()">Войти / Регистрация</button>
                <button class="btn-sub" onclick="enterAsGuest()">Войти как гость</button>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <header>
            <div class="logo" onclick="window.location.href='/'">Dota 2 Helper</div>
            <nav class="main-nav">
                <button class="nav-link" onclick="window.location.href='/drafts'">АНАЛИЗ ДРАФТОВ</button>
                <button class="nav-link" onclick="window.location.href='/invoker'">ТРЕНАЖЁР</button>
            </nav>
            <div style="display:flex; align-items:center; gap:15px;">
                <span id="user-display-name" style="font-weight:600; font-size:0.8rem;">Гость</span>
                <button onclick="logout()" style="background:transparent; border:none; color:var(--accent-red); cursor:pointer; font-weight:bold; font-size:0.7rem; text-transform:uppercase;">Выйти</button>
            </div>
        </header>
        <main style="text-align: center; padding-top: 100px;">
            <h1 style="font-size: 3rem; color: var(--accent-red);">ГЛАВНОЕ МЕНЮ</h1>
        </main>
    </div>

    <div id="auth-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="auth-tabs">
                <button id="tab-login" class="auth-tab active" onclick="switchAuthMode('login')">Вход</button>
                <button id="tab-register" class="auth-tab" onclick="switchAuthMode('register')">Регистрация</button>
            </div>
            <input type="text" id="auth-username" placeholder="Логин">
            <input type="password" id="auth-password" placeholder="Пароль">
            <button class="btn-main" onclick="submitAuth()">ПОДТВЕРДИТЬ</button>
            <button class="btn-steam" onclick="loginWithSteam()"><i class="fab fa-steam"></i> STEAM</button>
            <button class="btn-sub" style="margin-top:10px;" onclick="closeAuthModal()">Отмена</button>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
</body>
</html>
