<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Helper — Главная</title>
    <!-- Python сам заменит эту строку на global.css и header.css -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body id="body-index">
    
    <!-- ЭКРАН ПРИВЕТСТВИЯ (Центрированный через CSS) -->
    <div id="welcome-screen">
        <div class="welcome-card">
            <h1>Dota 2 Helper</h1>
            <p>Профессиональный анализ и инструменты</p>
            <div class="btn-group">
                <button class="btn-primary" onclick="openAuthModal()">Войти / Регистрация</button>
                <button class="btn-secondary" onclick="enterAsGuest()">Войти как гость</button>
            </div>
        </div>
    </div>

    <!-- ОСНОВНОЕ МЕНЮ (скрыто, пока не вошли) -->
    <div id="main-app" class="hidden">
        <header>
            <div class="header-left">
                <div class="logo" onclick="window.location.href='/'">Dota 2 Helper</div>
                <nav class="main-nav">
                    <button class="nav-link" onclick="window.location.href='/drafts'">АНАЛИЗ ДРАФТОВ</button>
                    <button class="nav-link" onclick="window.location.href='/fantasy'">ФЕНТАЗИ ПОМОЩНИК</button>
                    <button class="nav-link" onclick="window.location.href='/invoker'">ТРЕНАЖЁР ИНВОКЕР</button>
                </nav>
            </div>
            <div class="user-panel">
                <span id="user-display-name" class="user-badge" onclick="window.location.href='/profile'">Гость</span>
                <button class="btn-logout" onclick="logout()">Выйти</button>
            </div>
        </header>
        <main style="text-align: center; padding-top: 100px;">
            <h1 style="font-size: 3.5rem; color: var(--accent-red); margin-bottom: 20px; font-weight: 900;">ГЛАВНОЕ МЕНЮ</h1>
            <p style="color: var(--text-muted); font-size: 1.2rem;">Выберите инструмент в навигации выше.</p>
        </main>
    </div>

    <!-- МОДАЛКА ВХОДА -->
    <div id="auth-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="auth-tabs">
                <button id="tab-login" class="auth-tab active" onclick="switchAuthMode('login')">Вход</button>
                <button id="tab-register" class="auth-tab" onclick="switchAuthMode('register')">Регистрация</button>
            </div>
            <div id="auth-error" class="alert-error hidden"></div>
            <input type="text" id="auth-username" placeholder="Логин">
            <input type="password" id="auth-password" placeholder="Пароль">
            <button class="btn-primary" onclick="submitAuth()" style="margin-top: 10px;">ПОДТВЕРДИТЬ</button>
            <button class="btn-secondary" onclick="closeAuthModal()" style="width: 100%; margin-top: 8px; border: none; background: transparent;">Отмена</button>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
